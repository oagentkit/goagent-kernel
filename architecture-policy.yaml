# goagent-kernel 架构治理策略
#
# 双面设计：本文件既是「声明面」（模块清单 + 依赖方向 + owner，供人阅读与 AI 对齐），
# 也是「可执行面」（rules 段由 archcheck 包逐条执行，`make architecture-check` 门禁；
# 违反即非零退出）。正则一律 RE2 语法（Go regexp 原生，不支持 (?!...)——
# 负向前置用 negative_follow 结构化表达）。
#
# ── 与宿主仓的 architecture-policy.yaml 的分工 ──
# 本仓管「harness 不得长出领域知识」+「harness 内部依赖方向」；
# 宿主仓管「宿主不得上溯 harness」+「领域包治理」。两边互不覆盖，
# 合起来才构成完整红线（拆分后最怕的就是半年后业务代码慢慢渗回内核）。
#
# 纪律：
#   - 提交前跑 `make check`（本仓的 verify 聚合）；
#   - 新依赖方向先改本文件再写代码（policy 先行）；
#   - 新模块登记 {id, roots, requires, owner} 三元组；
#   - 例外必须带注释说明原因与拆除条件。

version: 1

# 每条**有执行体**的规则必须自带 examples（正例/反例），加载期自检。
#
# 为什么本仓开 true 而缺省值是 false：这条口径若只写在注释里就是散文。
# 规则会随词表改名、module 路径迁移而**静静地不再命中**——它照常编译、照常参与
# 报告、severity 照常是 error，唯独一件事都判不了。测试能证明「今天它还判得动」，
# 但测试在 CI 里跑一次；examples 在**每一次**门禁运行时跑，包括别人复用了这份
# 判据的宿主仓。
#
# 对复用方的缺省保持 false：强制补样例会让一次「升级判据」变成一次「策略改写」。
require_rule_examples: true

# ── 模块清单（requires = 允许的内部依赖方向）──
modules:
  - id: protocol
    roots: [protocol]
    requires: ["ext:github.com/oekit/pkg"] # 统一报告协议 + 宽容解析 + 结构化校验：机制层叶子包，零内部依赖
    owner: harness
    managed: true
    notes: |
      Report 结构含少量宿主填充的领域味字段（如 symptom 首句的检测对象标注）。
      该味**只存在于字段注释与格式约定**，不引入任何领域词表或判定逻辑——
      字段本身是通用字符串。域约束应落在宿主的 prompt/包声明里，不落进本包代码。

  - id: metrics
    roots: [metrics]
    requires: [retryplan, trajectory, "ext:github.com/oekit/pkg"] # 指标口径面：维度/基数上界引用 retryplan/trajectory 的量纲
    owner: harness
    managed: true
    notes: 内核指标契约面（issue #100）：五类运营量的名称/类型/维度/基数上界单一来源；business 选指标、transport 负责编码投递

  - id: cost
    roots: [cost]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: 运行成本治理口径面（issue #112）：任务级成本的计量单位/归集键/预算档单一来源，纯口径无外部投递

  - id: tenant
    roots: [tenant]
    requires: [cost, "ext:github.com/oekit/pkg"] # 配额判据引用 cost 的预算档口径
    owner: harness
    managed: true
    notes: 多租户判据面（issue #114）：隔离/配额/权限上下文的声明与判定纯函数，判据与执行分离

  - id: controlplane
    roots: [controlplane]
    requires: [contract, sideeffect, taskboard, tenant, "ext:github.com/oekit/pkg"] # 介入契约引用编排/副作用/任务板/租户四面
    owner: harness
    managed: true
    notes: 控制平面接口面（issue #115）：任务查看/运行状态/失败诊断/人工介入四类操作契约，判定逻辑一份（StorePlane），介入走令牌授权；Store 契约给一致快照 + 带版本锚的原子提交（状态与留痕同事务），MemStore/MemPlane 是进程内参考实现（issue #189）。权威控制面（NewAuthoritativeStorePlane，issue #268）把强制释放接到运行时的同一份 taskboard.Board、裁决接到 sideeffect.Store 读取的同一份状态，结构上不构造第二份可写任务/效果状态

  - id: statemachine
    roots: [statemachine]
    requires: [contract, "ext:github.com/oekit/pkg"] # 状态词表/终态判据单源引用 contract（issue #354/#357）；哨兵/判定走全仓统一 errors（issue #325）
    owner: harness
    managed: true
    notes: 环节状态机：条件迁移的纯函数件。状态常量全部是 contract 同值常量的别名、IsTerminal 委托 contract.IsTerminalStatus——词表不设第二份，只保留转移表与环节谓词；无编排依赖

  - id: eventbus
    roots: [eventbus]
    requires: ["ext:github.com/oekit/pkg", "ext:github.com/oagentkit/runtime", "ext:github.com/oekit/logx", "ext:github.com/oekit/concurrency"] # onDrop 留痕回调的 panic 隔离复用 subhub（已上移 oekit/pkg/subhub，v0.57.0）；退订监听走 async.GoWithContext（#378 自建逐订阅方克隆的扇出）
    owner: harness
    managed: true
    notes: 进程内有损广播（缓冲 chan）；持久化在发布点由宿主负责；durable 发布面（#160 写侧）与 event-tail 补灌面（#166 读侧）各为可选接缝，包仍零 DB 依赖

  - id: spill
    roots: [spill]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: 输出预算溢出：提示契约/取回/按龄清理，宿主与前端共用判据


  - id: netguard
    roots: [netguard]
    requires: ["ext:github.com/oagentkit/guardx", "ext:github.com/oekit/pkg"] # 订阅表已随 pii 上移 oekit/pkg/subhub（v0.57.0）
    owner: harness
    managed: true
    notes: 出站 URL 守卫（SSRF），纯 stdlib 叶子层

  - id: contract
    roots: [contract]
    requires: ["ext:github.com/oekit/pkg"] # 哨兵用 pkg/errors（ErrSessionDeadline 单源，#333）
    owner: harness
    managed: true
    notes: |
      编排运行契约：编排引擎与宿主状态之间的**唯一边界**（纯接口面，零实现）。
      L2 抽取在 flowEngine 处撞到的硬墙是「宿主状态模型带领域语义」——
      contract 是那道出口：编排语义字段定死在接口上，领域字段走开放键。
      零内部依赖、零外部依赖，故 requires 为空。

  - id: checkpoint
    roots: [checkpoint]
    requires: [contract, "ext:github.com/oekit/pkg"] # 只为复用 contract 的编排状态常量，避免终态语义被定义两次而漂移
    owner: harness
    managed: true
    notes: |
      编排续跑契约：进度快照的存取边界 + 「续跑而非重放」的恢复判定机制。
      「编排是代码」的必然推论是「崩溃后能接着跑」——此前本仓把编排状态全押在
      宿主 DB 上（eventbus 注明「持久化在发布点由宿主负责」），内核自己回答不了
      「这一步执行到哪了、重启后该从哪继续」。本包把这个选择做成可机械判定的纯函数，
      而不是留给宿主在崩溃那一刻临场决定（临场决定必然选最坏）。
      领域字段走开放键，与 contract 同口径。

  - id: budget
    roots: [budget]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      上下文预算：分段计量 + 窗口钳位 + 「压实而非丢弃」的压实计划骨架。
      本仓原有 spill 只管**输出**超预算；输入侧的上下文计量此前完全缺位。
      摘要生成与原文落盘各留一个接口由宿主实现（内核不自己调 LLM、不碰存储）——
      与「LLM 只做单环节」「编排只认接口」同一条纪律。

  - id: offload
    roots: [offload]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      内联大对象外置：把 base64 二进制从每轮重发的历史里换成占位文本。
      与 spill 是姊妹机制但语义不同——spill 管文本输出溢出，offload 管
      「二进制本体躺在消息里」。两阶段（首次标记、后续轮才替换）是正确性关键：
      首次就替换会让模型永远看不到该对象。

  - id: tooldisclose
    roots: [tooldisclose]
    requires: [toolname, "ext:github.com/oagentkit/guardx", "ext:github.com/oekit/pkg"] # 派生调用形态时的函数名规整，与 ptc 共用同一套规则
    owner: harness
    managed: true
    notes: |
      渐进式工具披露 + 执行门禁。工具一多，tool_definitions 自己就吃满上下文，
      故先只暴露「名字+描述」占位，按关键词检索换完整 schema。
      门禁的核心是把两类失败严格区分开：未加载（可重试，顺手激活）与
      不在目录（不可重试，明确禁止绕过）。目录与打分均为确定性，编排才可复现。

  # L2 第二批机制包（随包下沉登记）。requires 反映**真实**依赖方向，不是「理想形态」：
  # watchdog 确实读 eventbus，就写 eventbus。此前这里写的是 requires: [] 并附一句
  # 「同仓叶子引用不算模块间方向约束」——那是给自己开的口头豁免，且因为 requires
  # 从未被执行过，连漂移都没人发现（执行体见 archcheck/deps.go）。
  - id: ptc
    roots: [ptc]
    requires: [toolname, egress, "ext:github.com/oagentkit/guardx", "ext:github.com/oagentkit/runtime", "ext:github.com/oekit/concurrency", "ext:github.com/oekit/pkg", "ext:github.com/oekit/logx"] # guardx 含 sandbox/wire（跨进程协议；执行档位与后端协议自 v0.35.0 起直连） # runtime/procx 管「子进程能看见什么环境」（白名单，非全量继承）；工具名→JS 标识符的规整规则，唯一的真相在 toolname 包
    owner: harness
    managed: true
    notes: 程序化工具编排沙箱（goja VM，三重预算替代 OS 沙盘）

  - id: watchdog
    roots: [watchdog]
    requires: [contract, eventbus, trajectory] # INV3 的 status 终态词表消费 contract（不自立第二套）；告警广播走 eventbus；配对缺口 reason 引用 trajectory.Pairing（#392，同一事实不得两份实现）
    owner: harness
    managed: true
    notes: |
      配对不变量监视，只告警不裁决。依赖 eventbus 是为了在检测到
      「声明未执行 / 执行未声明」时把异常广播出去——配对不变量违反了却无人知晓，
      等于没有监视。
      INV1/INV2 是工具调用级配对（声明↔结果）；配对键与 trajectory 同源
      （eventbus.ToolCallID：全局 call_id，不含 step）——step 是归属信息而不是
      配对键，结果可跨环节到达、同号声明可跨环节重试，按 step 分段会产出假红
      （issue #336）。INV1/INV2 的 reason 词表直接引用 trajectory.Pairing——
      unpaired_result/duplicate_result/duplicate_call 三条逐字同名，
      declared_not_executed 是 missing_result 的注册别名（eventbus 侧映射，
      issue #392）。INV1 的判定时刻是会话收口（session_finished）或 TTL 清扫，
      不是每个 step_finished。INV3（issue #171）是它的外层——
      轮级括号配对：turn_started 开括号、turn_ended 闭合，闭合必须带归因
      （closed_by ∈ 宿主注册词表，缺省见 eventbus.ClosedByDefaults：
      loop|recovery|boot-reconcile|panic|recovery:dead-owner|recovery:dead-lease
      ——生产方 reconcile 的四路归因与消费方缺省表同源，issue #391）与
      contract 终态词表内的 status；停机留开放=合法态（Run 退出不扫尾告警）、
      开放超时=open_leak（与既有 openIdleTTL/sweep 同款 TTL 清扫）。
      closed_by 词表开放给宿主注册，内核只判「有没有（在册的）归因」，
      不判归因的语义正确性（那是宿主恢复路径的裁决面）。

  - id: delta
    roots: [delta]
    requires: ["ext:github.com/oagentkit/runtime"]
    owner: harness
    managed: true
    notes: 增量节流：(kind,iteration) 键控 + 权威整段优先 + 确定性收口扫序

  - id: pending
    roots: [pending]
    requires: []
    owner: harness
    managed: true
    notes: 多轮挂起态载体：单一编码入口 + 宽容解码

  - id: sideeffect
    roots: [sideeffect]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      副作用「至多一次」的跨进程契约：幂等键（同一逻辑动作重试不重复施加）+
      租约（同一资源独占，带 TTL）+ 栅栏令牌（过期持有者的迟到写入被下游拒绝）+
      下游拒收契约（FencedSink：比较与写入须同一次原子操作）。
      零内部依赖——它是叶子层。宿主实现 Store 接口落库，判据归内核。

  - id: sidetest
    roots: [sidetest]
    requires: [sideeffect, "ext:github.com/oekit/concurrency", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      sideeffect.Store 的共享契约测试套件：宿主写完存储实现后跑一遍，
      违反哪条契约就红在哪一条——免得「各写一遍必然各判一套，漂移到没人发现为止」。
      依赖 sideeffect 是因为要 import 它的契约类型（套件判的是它的实现）。

  - id: retryplan
    roots: [retryplan]
    requires: ["ext:github.com/oagentkit/guardx"]
    owner: harness
    managed: true
    notes: |
      重试处置决策：把「该不该重试」（上游 guardx/toolfail 判）与「重试会不会重复施加」
      （sideeffect 判）合成一条可执行结论——三档路径（不重试 / 原样重发 /
      走幂等键重放）。与 guardset 同族：**组合逻辑归内核，判定归各自机制**。
      零内部依赖（不 import sideeffect：两者是契约上的衔接，不是代码耦合）。

  - id: preset
    roots: [preset]
    requires: [egress, gatecheck, "ext:github.com/oagentkit/guardx", "ext:github.com/oagentkit/toolgate", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      命名权限预设：把「隔离档位 × 审批模式 × 出口策略」三件散参数收成一份**具名、
      不可变、可自检**的整份配置。

      补的是「零件齐了但组装件没有」。三面的零件本仓都有（sandbox.Level /
      policy.Mode / egress.Spec），但每次执行由宿主自己拼，而拼错不会报错：
      档位传成零值 ⇒ 沙箱层不构成约束而调用点看起来「声明了档位」；出口漏传 ⇒
      零值即「不要求」而这次执行自由出网；两个参数配成互不相容的组合 ⇒ 没有任何
      一处会对此说一句话。

      自检项里最关键的一条是「**三面全松必须显式承认**」：档位 none × 模式 full ×
      出口不限时必须写 Unsafe 与理由。目的不是拦住这个决定，而是让它留下签字——
      否则它就变成「反正先跑起来」留下的、没人认领的松口。

      另一条是「语义相同的两个名字要报错」：两个名字一份组合在配置里看起来是
      「两个选择」，真正的伤害在留痕——报告里出现两个名字，读者会以为执行过两种权限。

      Resolve 遇到未登记名字**报错而不降级**：降级到缺省的方向不可预测（可能更松），
      而「打错一个字就用上另一档权限」没有任何信号。

  - id: cmdpolicy
    roots: [cmdpolicy]
    requires: ["ext:github.com/oekit/pkg", "ext:github.com/oagentkit/tools"]
    owner: harness
    managed: true
    notes: |
      命令级判据：把判定面从「工具调用」向下延伸到「工具内部实际执行的那条命令」。

      此前判定边界停在工具名上：一次 tools.exec 被审批通过之后，它内部跑的是
      git status 还是 rm -rf / 没有任何机制面看得见。宿主只能用正则黑名单兜，
      而黑名单在「写法与语义不一致」时必然失效（多空格、变量拼接、子命令替换）。
      本包改用**前缀 token 规则**：先分词再比 token，判据不随引号/转义/空白漂移，
      且拒绝理由可解释、能直接回给模型。

      三态裁决（allow / prompt / forbidden）与 toolgate 的裁决词表同义，不引入
      第二套口径——prompt 直接接 gatecheck 的「需人审」档。

      **规则自带样例，加载即自检**：每条规则可带 Match / NotMatch，New 在加载期
      用真实判定路径跑一遍，不一致即报错。这是「从没见过它触发的规则等于没有规则」
      那条纪律的机器化——规则会随命令名漂移，而漂移不会报错，只会静静地不再命中。

      SplitCommands 单独存在是因为前缀判据有一个典型绕过："git status; rm -rf /" 的
      前缀是 git，对整串只判一次就会让一条 git 的 allow 规则放行后半段。

      **分词面归上游**（2026-11-11 收编）：分词是 oekit/pkg/shellx.Split，段文本拼装是
      shellx.QuoteArgv（它的逆运算，保证段可往返）。本仓不再维护第二份分词口径——
      口径只有一处真相，且 POSIX 细节（双引号内反斜杠、分隔符合并、CR 归空白）
      由上游维护。判据面（前缀规则 / 三态裁决 / 样例自检）仍归本仓。

      **事实面归上游**（2026-11-11 收编）：「这条命令里出现了什么」（全调用集、
      全重定向集、动态词）走 oagentkit/tools/bashguard 的真 shell AST（mvdan.cc/sh），
      本仓不手写 shell 解析器。前缀判据的三类典型绕过（多段 / 命令替换 / 写重定向）
      由「全调用面取最严 + 事实面下限（写重定向、动态展开 ⇒ 不低于 prompt）」闭合。
      bashguard 的只读/不可逆风险分级是另一套语义，本包不用。

  - id: egress
    roots: [egress]
    requires: ["ext:github.com/oekit/pkg", "ext:github.com/oagentkit/guardx"]
    owner: harness
    managed: true
    notes: |
      出口策略：三档（不限制 / 只经代理 / 完全禁网）+ 声明自检 + 兑现判据。

      本包**不含代理本体**（那是上游 guardx 与宿主的活）——它只回答三件此前没人回答
      的事：①这次执行要求哪一档出口；②宿主给的环境变量是否**真的**兑现了那一档；
      ③某个沙箱后端能不能兑现它。

      依赖 sandbox 只是为**类型同一**：出口档位词表与能力声明契约的真相在
      上游的 guardx/sandbox（EgressMode / EgressEnforcer），本包用 type alias 指过去。
      为什么不能在本包定义词表：Go 的接口一致性要求返回值类型同一，词表留在本包则
      上游任何执行后端要声明「我能兑现」都得 import 本仓 ⇒ 成环 ⇒ 那条接口在结构上
      只可能由宿主实现，且编译期不报错。实测代价是一整条出口声明链空转一轮。

      底层的判据是「**沉默按最弱处理**」：后端不声明 Enforcer 就视为不限制，
      而不是视为满足——否则一个从没实现过出口控制的后端会因为「没说不支持」而被
      选中，声明与实际之间的落差没有信号。

      **禁网档拒绝伪造**：ModeDenied 的 Env/Verify 直接报错而不是「尽力而为」。
      假装禁网比明确拒绝更危险——报告会显示「已兑现」，而网络其实通着。

  - id: gatecheck
    roots: [gatecheck]
    requires: [egress, "ext:github.com/oagentkit/guardx", "ext:github.com/oagentkit/toolgate", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      审批层与沙箱层的**联合判据**：Codex 的两层安全模型是「沙箱强制 +
      审批策略，两层都同意才放行」。上游 guardx/sandbox（档位×预算）与
      toolgate/policy（审批裁决）各自完整但**互不知情**，「两层是否都同意」
      这个判定没有单点——落在各宿主手里必然漂移。本包只做**合成**，
      不重新实现任何一层（那会造成与上游并存的第二份真相）。

  - id: taskboard
    roots: [taskboard, taskboard/boardtest]
    requires: ["ext:github.com/oekit/concurrency", "ext:github.com/oekit/pkg", tenant]
    owner: harness
    managed: true
    notes: |
      多 agent 协调面的**存储中立契约 + 一致性判据**（P1-4）。

      dispatch 只回答「能不能派」。派出去之后的三件事——谁负责哪个子任务、
      它依赖谁、怎么把认领还回去——此前没有任何机制面：各宿主自己拿一张表
      兜着，于是「同一子任务被两个 agent 同时认领」这种错在报告里读起来
      完全正常（两条分支都干完了活，各自都以为自己是负责人）。

      本包**不给存储实现**：表结构、事务边界、持久化形态是宿主资产，给一份
      参考实现宿主就会照着改它，最后两份真相并存（与 checkpoint.StoreCAS
      同一条分工）。给的是三样：Board 接口、快照不变量判据（Check，纯函数）、
      并发正确性判据（ConcurrentClaim，返回成功者数量而不是「测过没」）。

      三条口径值得单说：① 认领必须**原子**由存储保证，本包只判结果；
      ② 释放/完成**凭令牌不凭内容**（同名 agent 与「失败→释放→重试」都会让
      内容比对认错人，这是 commitgate 踩过的坑）；③ **failed 不是终态**
      （一次失败不能把子任务永久钉死，否则宿主的补救路径静默失效）。

  - id: skilldisclose
    roots: [skilldisclose]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      技能披露：确定性挑出该给模型看的那几个技能（P2 里唯一立刻可做的一项）。

      与 tooldisclose 的分工不是「重复」：tooldisclose 的检索键是**工具调用需求**，
      而技能的触发信号有三种且**强度不同**——点名 > 资源命中 > 描述相关。
      混成一个分数会让「相关」压过「点名」，而那正是用户已经明确表达过的意图。

      三条判据：点名权重必须高于任何相关度信号；同分按名字（不依赖 map 顺序）；
      预算裁剪必须显式（静默截断会让宿主以为「就这几个相关」）。空结果必须
      写明原因——「没有检查」与「检查通过」在调用方看起来一样。

  - id: hookengine
    roots: [hookengine]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      Hooks 的**判定面**：什么时候该跑、跑了算不算拒绝（P2 里最需要划边界的一项）。

      Codex 是「外部进程协议 + 规则文件」，DSH 是「动态插件包」——形态**已经分叉**。
      此时由内核定一种形态等于替宿主选边（把传输/加载焊进契约），故只定三件跨形态
      恒定的事：匹配、裁决、顺序与收口。传输与加载归宿主（Runner 是唯一接缝）。

      两条 fail-closed：阻塞 hook 执行失败 ⇒ deny（跑不起来不等于没问题）；
      超时的裁决必须显式声明（缺省 deny），否则超时会被 ctx 取消掩盖成「这次没拒绝」。
      非阻塞 hook 不参与裁决但失败必须留痕——它一旦能影响裁决，就只是「慢的阻塞 hook」。

  - id: memorypipe
    roots: [memorypipe]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      记忆注入的三段：**注入 / 引用 / 打标**（读写时机归宿主，与 budget 的 Summarizer
      同一条边界——内核不替宿主决定「这次值不值得记住」）。

      注入侧有三件事与策略无关、各宿主各写一遍又必然各判一套：① **来源是前提**
      （没有来源的记忆与模型的猜测在文本上无法分辨 ⇒ 不注入、显式丢弃并说明）；
      ② **逐条打标**（id/source/at 三样缺一就少一条追溯路径）；③ **裁剪显式**。

      scope 精确匹配、**不做父级兜底**：按 project 查却回退到 global 看起来更友好，
      代价是作用域失去意义——只该在某个项目里生效的记忆会在任何会话里生效，
      而报告完全正常。

  - id: delegate
    roots: [delegate]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      异构委托的**契约面**：请求能不能交出去、交出去算不算完成（P2 里的协议面）。

      ACP 一类的东西同时是**协议 + 传输**，线格式归上游；本包只定跨传输恒定的三条：
      ① 能力必须**子集**（做不到就拒，不许「尽力而为」——尽力而为的结果无法判定
      「没做到」与「本来就没要求」）；② **最小能力原则**选执行方（多个都能接时取能力
      最少者；按顺序取第一个会让一次无关的配置重排换掉执行方）；③ 回执状态**三值**
      （把「被拒绝执行」混进「执行失败」会让委托方去修一个不存在的 bug）。

  - id: worktree
    roots: [worktree]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      工作区隔离的**声明面与冲突判据**（不碰真实文件系统——本仓至今不碰 FS 语义）。

      并行工作区会不会互相踩这件事此前没人判：两个 agent 各自「在自己的目录里工作」，
      而可写区完全重叠时，任何一边的写入都会让另一边的结论失效，报告里却只有两份
      「各自成功」。故本包判三件：声明自检（同一工作区不得既只读又可写）、
      **可写区重叠即冲突**（只读重叠不算）、无命中即不可读写（fail-closed——
      默认允许会让漏写的一行声明变成全域可写）。

      **不支持通配**（写明的局限）：* 与 ** 的语义各实现不同，进契约就会出现
      「按 A 的理解写、按 B 的理解判」。需要更强表达力时宿主自己展开成多条精确声明。

  - id: sessionref
    roots: [sessionref]
    requires: ["ext:github.com/oagentkit/guardx", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      跨会话引用快照：把「另一个会话的结论」以**有界、带来源、带失效点**的片段
      注入当前上下文，并把「新鲜度」变成可机械判定的一维。

      它补的是 budget / spill / offload 都不管的那一段：三者回答的都是「**同一份
      上下文**里内容放不下怎么办」，而「引用另一个会话的结论」是另一件事——那份
      内容不在当前上下文里，它的边界与保鲜度没有任何机制面管。不管的后果不是
      「引用得不好」，是把**当时的**结论当成**现在的**结论用，而这类错误在报告里
      读起来完全正常（那段话当时确实是真的）。

      三条判据都走结构而非约定：① 裁剪上限在采集时给定，且裁剪了必须显式标出
      （@Truncated@ + @OriginalBytes@，外加注入面的 @truncated=true@）——静默截断
      会让模型以为看到的是全文；② @Source@ / @SourceVersion@ / @CapturedAt@ /
      @ExpiresAt@ 随快照走，失效判定只需「现在几点 + 源现在第几版」；③ 渲染时
      把 @state=fresh|expired|stale@ 写进包裹体。

      版本这一维不可省：TTL 是**采集者猜的**，源是否前进是**事实**，长 TTL + 高频
      源更新是最常见的失效形态，只靠时间会一路判有效。版本**回退**同样判 stale
      （同一个 id 指向的已不是同一段历史）。两者同时成立时报 expired：时间已过是
      宿主必须无条件重采的那条。

      渲染**不拒绝、只标注**：拒不渲染会让「引用过期」变成「引用消失」，宿主无从
      区分「本来就没引用」与「引用了但过期」。防伪不另写一套——走 @injectband.Wrap@
      统一包裹（防伪实现只允许一份）。

  - id: drain
    roots: [drain]
    requires: ["ext:github.com/oekit/logx", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: 优雅排水：轮 ctx 取消脱钩 + 等在途收敛 + 预算耗尽强制收刀

  # 2026-11-15 新增：drain 两处明写「留给启动对账」的那半边（issue #165）。
  #
  # 为什么值得单开一个包：drain 的包注释写着「强制路径按宿主的进程停机分支处理
  # （不写终态，留给启动对账）」「排水超时：强制中断（留启动对账收敛）」——
  # 这是内核自己留的洞，至今空缺，各宿主只能在启动/恢复路径上各自手搓同一套
  # 三路判定，各判一套必然漂移。判据只依赖宿主可注入的事实（instance 身份、
  # 最后事件时刻、心跳租约表、进程启动锚点）+ 一个收敛动作，零宿主领域词——
  # 与 taskboard 同范式：语义归包、落库归宿主 Store 接缝。
  #
  # 与同域包的划界（issue #165 划界段逐条）：vs checkpoint（「续跑而非重放」，
  # 方向相反）是补充；vs drain（计划内停机 vs 非计划死，成对件）；vs worker.Recover
  # （任务重跑 vs 会话收敛、不重跑）对象与动作都不同；vs sideeffect/coord 的
  # 「对账」（结果未知的副作用裁决）同词不同域，包头互指。
  - id: reconcile
    roots: [reconcile]
    requires: [contract, eventbus, "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      启动孤儿对账与心跳租约死主回收：三路判定（boot-anchor / event-silence /
      heartbeat-lease）+ 宽限窗 + CAS 收敛编排，与 drain 成对（drain=计划内、
      reconcile=非计划死）。状态词表复用 contract（终态语义不定义两次），
      收尾事件走 eventbus 词表，四路归因值引用 eventbus.ClosedBy*（与消费方
      watchdog 的缺省表同源，issue #391）；存储事实全经 Store 接缝注入，
      包零 DB/gorm 依赖。

  - id: commitgate
    roots: [commitgate]
    requires: ["ext:github.com/oekit/pkg", "ext:github.com/oekit/logx"]
    owner: harness
    managed: true
    notes: |
      环节终态独占提交闸：同一 (run, 环节) 的终态只允许被提交一次。
      statemachine 是纯谓词、checkpoint 只排快照序号，两者都排不出
      「两条并行分支都赢了」——那条边界只有独占提交闸能表达。
      logx：Deprecated Seed 的回灌失败留痕（issue #204，缺省 warn 通道）。
      本条登记是 2026-10-18 依赖方向门禁落地时补的：包早已存在并被 docsync
      计入 README 包表，却从未进过 modules 段，故对本门禁隐形（依赖方向无人判定）。

  - id: guardset
    roots: [guardset]
    requires: ["ext:github.com/oagentkit/guardx", "ext:github.com/oekit/pkg"] # 订阅表已随 pii 上移 oekit/pkg/subhub（v0.57.0）
    owner: harness
    managed: true
    notes: |
      守卫装配契约：一组相互独立的判定一并求值，多条拒绝合成一条。
      接进 oagentkit/toolgate 的 invoke 链作为单独一环——链本身由上游负责，
      本包只补它按设计不覆盖的那一面（链在第一个拒绝处就收口，后面的守卫没机会说话，
      模型一次只听得到一个理由）。
      不重复实现链：顺序执行、留痕、panic 兜底全部沿用 invoke.Chain。

  # 2026-10-19 新增：工具名→JS 标识符的规整规则，收成单一真相。
  #
  # 为什么值得单开一个包：这条规则有两个消费者——生产侧（tooldisclose 从目录
  # 派生给模型看的调用形态）与消费侧（ptc 把绑定挂到 host.<净化名> 上并校验
  # 形态里的函数名）。两侧必须**逐字一致**，否则就是「生产侧派得出、消费侧
  # 认不出」的夹缝。
  #
  # 它曾经两边各写一份（规范名写成两份、净化规则又各写一份），于是漂移开了：
  # 生产侧照抄目录原名、消费侧按净化名挂载，契约在文档里写着「直接可用」，
  # 代码里却拒——而旧版测试还把「会被拒」钉成了预期行为，两边的错一起被固化。
  - id: toolname
    roots: [toolname]
    requires: []
    owner: harness
    managed: true
    notes: |
      工具名→程序内可用的 JS 标识符：一条单一真相。
      IsJSIdent（能不能直接用）+ Normalize（不能的话用哪个）。
      规整不保证唯一（get-logs 与 get_logs 同名）——撞不撞由调用方判
      （ptc 在装配期拒，因为顶替意味着副作用错位）。

  # 2026-10-29 新增：事件流 → 轨迹行的投影。
  #
  # 为什么值得单开一个包：「这一轮花了多久」这件事此前没有单点——宿主只能自己
  # 从事件流里拼起止时刻、按 call_id 手工配对工具调用与结果，各拼一套必然漂。
  # 尤其**时长这一个数**：有人拿载荷体积估、有人拿 token 数除、有人按事件时刻
  # 相减——三种口径混进同一张表，谁也说不清哪一列是实测、哪一列是猜的。
  #
  # 本包把口径收成单源：**时长只有起止时刻相减一个出处**，行里不存时长字段
  # （Duration() 现算），于是估算值结构性无处安放——不是靠纪律约束，是装不进去。
  # 配对缺口（缺结果/重复结果/无对应调用/重复声明）显式可见，不静默丢弃。
  - id: ticket
    roots: [ticket]
    requires: []
    owner: harness
    managed: true
    notes: |
      一次性短时授权票据的机制面：签发/单次消费/TTL/用途绑定。消费即作废，
      过期判定与消费判定同一处；绑定载荷原样携带，语义归宿主解释。零内部依赖
      （纯 stdlib），时钟可注入——过期语义要能被确定性测，不靠 sleep。
      票据空间有界且满了显式拒发（默默淘汰会让宿主以为票据还在，实际已失效）。

  - id: trajectory
    roots: [trajectory]
    requires: [eventbus]
    owner: harness
    managed: true
    notes: |
      事件流 → 轨迹行投影：轮次/步骤/工具三类行，起止时刻取自事件时刻，
      时长由起止相减得出（无实测即无值，不拿估算补）；工具调用与结果按 call_id
      配对，缺口进 Issues 显式可见；增量投影支持「先喂一半再喂后半，行被更新
      而非重复」。依赖 eventbus 是为了吃本仓自己的事件词表，不另立事件模型。

  # 2026-10-19 新增：门禁执行体从 package main 下沉为可导入包。
  #
  # 为什么它属于本仓（而不是留在宿主仓各写一遍）：判据是「AST + 一张声明表」，
  # 不认识任何领域概念——**机制面**。而门禁执行体若锁在 package main 里，
  # 别的仓就够不着：于是每个宿主要么各写一遍判据（各判一套，漂移到没人发现），
  # 要么干脆不写（policy 的依赖拓扑表变成死条文：躺在文件里、看起来有人维护过，
  # 实际一条都不判）。
  # 参考运行时示例（v0.32.0 新增）：端到端演示机制怎么串起来。
  #
  # 为什么它是**模块**而不是散落的脚本：未登记的包目录对依赖方向门禁**隐形**——
  # 任何模块都能 import 它而不判违规。于是示例里长出的真实依赖（checkpoint /
  # commitgate / sideeffect / taskboard）就没人管了。
  #
  # 为什么它零新依赖：存储用**纯 stdlib 内存实现**。本仓「依赖面窄」是既有优势，
  # 不为示例牺牲——真实 PostgreSQL 的接入形态由下面的 pgrefstore 模块承担
  # （v0.33.0 起，issue #94）。
  - id: reference-runtime
    roots: [examples/reference-runtime]
    requires: [checkpoint, commitgate, contract, sideeffect, taskboard, "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      参考运行时示例：创建任务 → 多步骤执行 → 中断 → 恢复续跑 → 并发认领 →
      副作用对账。它是**示例**不是能力包：机制面仍在 checkpoint/commitgate/
      sideeffect/taskboard 里，本目录只演示它们怎么接线。



  # 容器执行后端参考实现（2026-11-13 新增，issue #109）：backend.Backend 的
  # 容器形态落点。
  #
  # 为什么它是**独立示例子包**而不是内核子包：与 pgrefstore 同一条边界——
  # 参考实现不是内核依赖，容器引擎的接入形态（socket 位置 / 集群凭据 /
  # 镜像仓库策略）是宿主资产。宿主抄它、不 import 它。
  #
  # 为什么零第三方依赖：Docker 走 Engine HTTP API（stdlib net/http，
  # unix socket 直连），**不引 Docker 客户端库**；Kubernetes 走
  # kube-apiserver HTTP API（stdlib net/http + in-cluster token/CA），
  # **不引 client-go**——引它会让示例的依赖图追着 K8s 版本跑。
  - id: containerbackend
    roots: [examples/containerbackend]
    requires: [backend, "ext:github.com/oagentkit/guardx", "ext:github.com/oekit/concurrency", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      Docker Engine 参考实现（IsolationContainer + EgressDenied 以 network=none
      兑现 + 内存经容器上限兑现，日志多路复用流 demux）+ Kubernetes Job 参考
      实现（issue #192：Namespace/ServiceAccount 可配、Egress=denied 以逐作业
      NetworkPolicy 兑现且建不出来即拒绝创建作业、ttlSecondsAfterFinished 兜底
      清理、conditions/succeeded/failed/active 状态对账——Pod 被强删/节点失联/
      Job 消失一律 unknown 失败，不谎报成功）。测试以 httptest 假引擎 /
      假 apiserver 对拍，不需要真实守护进程或集群。

  - id: archcheck
    roots: [archcheck]
    requires: []
    owner: harness
    managed: true
    notes: |
      架构门禁执行体：architecture-policy.yaml 的可执行面（规则判定、门包判定、
      依赖方向判定、policy 自校验、结构阈值）。
      requires 为空：只依赖 stdlib 与 yaml.v3，不依赖本仓任何机制包——
      门禁必须是**最底层**的东西，否则「用它判别人」就变成「它自己也在被判定」，
      门禁的红绿会依赖它所判的代码。

  # 2026-11-06 新增（issue #35）：`cmd/ptcchild` 此前靠 dependency_direction 的
  # 目录级豁免 `[cmd]` 顺带盖住，从未经过任何判定面。
  #
  # 它的性质是「**测试夹具 + 执行入口**」：不作为独立二进制发布，而是被 ptc 的用例
  # `go build` 出来当被测子进程（正常形态回 Result 帧 / noop 形态读掉 stdin 后干等，
  # 用来验证「子进程不回结果时父侧必须限期收场」）。
  #
  # 登记进来的好处是它的依赖边**被真的判着**：它只允许依赖 ptc，多引一个机制包就红。
  # 这比「按目录整棵跳过」严格——后者连「它 import 了什么」都不问。
  - id: ptcchild
    roots: [cmd/ptcchild]
    requires: [ptc]
    owner: harness
    managed: true
    notes: |
      ptc 子进程后端的被测入口（测试夹具，不发布为独立二进制）。
      requires 只有 ptc：它调 `ptc.MaybeRunChild()` 进子进程协议。
      **不含裸执行入口 ptc.Run** ⇒ 执行路径门禁对它是绿的，且是**真的判过**的绿。


  # 2026-11-18 新增（台账 §15 第七阶段建议 1）：单号状态的**派生器**。
  #
  # 为什么进内核而不是留在某个 cmd 里：单号 → 状态这个事实被两处消费
  # （台账门禁 cmd/ledgercheck、部署清单 cmd/deploymatrix），两处各解析一遍
  # markdown，结论必然分叉——而分叉的方向恰好是「门禁判的和台账写的不是一套」。
  # 派生器下沉为可导入包，两个消费方读同一份事实。
  #
  # 为什么是机制面而不是资产：它不认识任何宿主领域——输入是一份 markdown
  # 台账，输出是「单号 → 状态 / 关闭 PR 号」；判据形态（哪些表头算登记列、
  # 哪些词算状态标记）是**本仓文档约定**，不是运维词表。
  - id: ledgerstatus
    roots: [internal/ledgerstatus]
    # gopkg.in/yaml.v3（issue 状态快照的解析）**不写进 requires**：它是第三方依赖，
    # 按 dependency_direction 的口径「不在受管面内、不需要逐包声明」——archcheck 同样
    # import 它而 requires 为空。写成 ext: 反而会因它不在 ext_prefixes 里被判越界
    # （2026-11-21 实测：加了当场 exit 2）。
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      演进台账（docs/DISTRIBUTED-EVOLUTION-*.md）的单号视图：登记列 / 状态列 /
      散文标记三处约定派生出「单号 → 已合入 / 仍开着 / 派生不出」。
      解析容错：表格形状歪了收进 Problems() 而不是让整份台账读不出来
      （「解析不出来却不说话」= 判据静默失效）。
      **PR 号不进单号视图**：落文档的 PR #N 与被登记的单 #N 是两种号，
      混成一种后撞车时合并结果没有意义。

  # 2026-11-13 新增（issue #109 / #110 / #111，本轮清零）：三个 P3 特性单的
  # 机制面。为什么都是**契约 + 判据**而实现放示例：三单的传输/引擎形态都是
  # 宿主资产（容器引擎怎么接、跨进程存储怎么落库、录制格式怎么演化），
  # 内核只定「要求 vs 实际」的判定口径——与 taskboard「不给存储实现」、
  # delegate「线格式归上游」是同一条分工。
  - id: backend
    roots: [backend]
    requires: ["ext:github.com/oagentkit/guardx", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      任务式执行后端的契约面（issue #109）：隔离轴（none/process/container/vm）、
      能力自报（EgressEnforcer / Capable 与 sandbox 同构同词表——沉默按最弱）、
      要求对照判据（SatisfiedBy，fail-closed）与登记簿（无满足者即拒绝不降级，
      满足者取最弱、同档按 ID 字典序）+ 进程内兜底实现（Inline，显式声明
      IsolationNone）。Docker Engine 与 Kubernetes Job 两份参考实现在
      examples/containerbackend。隔离轴在本包重立而出口词表复用 sandbox：
      上游 Level 枚举值即强弱序，往中间插容器档 = 跨仓破坏性变更；
      对应关系只写在 Isolation 注释里，不做代码级映射（第二真相）。

  - id: handoff
    roots: [handoff]
    requires: [delegate, "ext:github.com/oekit/concurrency", "ext:github.com/oekit/pkg"] # 回执状态词表单源引用 delegate.Status（issue #358）
    owner: harness
    managed: true
    notes: |
      跨进程任务交接的契约面（issue #110）：交接点（Store/Ticket）、原子性
      （Take 一次原子操作完成负责人转移，判据 ConcurrentTake 赢家恰好 1）、
      幂等键（同 Key 重放返回原单；重新交接 = 新一代，代次与令牌同源——
      taskboard 的 Fence 口径）、回执寻址（ReplyTo 必填 + 只有 To 能领取 +
      回执凭存储铸造的令牌）、超时（一条时限线覆盖领取与回执，无时限交接
      契约禁止；迟到的领取与回执一律拒收）。回执状态三值（completed /
      failed / refused）与 delegate.Status **同一份词表**：ReceiptStatus 是
      delegate.Status 的类型别名，不再各写一份字面量（issue #358）。
      进程内参考实现 LocalDesk 只证契约可满足，不做跨进程承诺。

  # 2026-11-17 新增（issue #273，分布式演进 L3）：跨区域所有权权威。
  # 为什么单独成包而不是并进 handoff：Handoff 的 Epoch 管的是**交接单**
  # 的代次（同一 Key 重新挂出 = 新一代），不是**任务域所有权**的权威——
  # 分区后「哪个区域有权提交这个任务域」此前没有判据。本包只给契约与判据，
  # 共享权威的持久化/选主归宿主（与 taskboard「不给存储实现」同一条分工）。
  - id: ownership
    roots: [ownership]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      跨区域任务所有权权威的契约面（issue #273）：任务域 → 权威区域的映射是
      可配置、可校验、可查的事实（RegionMap / Authority.Mapping / Owner）；
      每个任务域在任一时刻恰好一个权威区域，所有权带区域与代次（Epoch）。
      跨区域转移走两阶段：BeginTransfer 只记录候选代次（= 当前 + 1）与回执
      令牌，**不改变**当前权威；ConfirmTransfer 由目标区域凭回执令牌确认，
      成功后换代是一次原子操作（代次提升 + 区域切换 + 令牌重铸），旧代
      提交一律 ErrStaleEpoch、候选代次在确认前一律 ErrEpochUnconfirmed。
      提交路径只依赖 Fencer 接缝：任何错误（含权威不可达）都必须拒绝，
      fail-closed。判据 Judge 是纯函数，MemoryAuthority / Local 共用同一份。
      不新增 TTL/租约面（所有权不是租约，任务租约仍归 taskboard/handoff）；
      单区域部署退化为 NewLocal（本区域即权威，转移显式 ErrSingleRegion）。
      MemoryAuthority 是进程内参考实现，不承诺跨进程原子性。

  - id: eval
    roots: [eval]
    requires: [eventbus, trajectory, "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      轨迹的录制 → 重放 → 差异比对与确定性评估判据（issue #111）。锚点是
      trajectory 的确定性行 ID；时刻是数据不是时钟（录制即定格，重放即复读）。
      Verify 判「录制适航」（头部字段往返保真 + 载荷往返幂等）；Diff 是纯函数
      且排序确定；Assess 是纯函数评估判据（收口/配对/重复/期望/禁止五个判项，
      零判项显式拒绝——「没有检查」与「检查通过」必须分得开）。

  # ── 2026-11-13 新增（issue #106 #107 #108，清零战役 Y1b1）─────────────
  #
  # 三个新机制包 + 一个示例子包，登记先于代码（声明先行）。
  #
  # coord（issue #107）：分布式协调后端的**适配形态约定**。协调契约
  # （sideeffect.Store / taskboard.Board）此前只有 PostgreSQL 一种参考适配
  # （pgrefstore）——「后端不止一种，且形态有约定」那一半是空的。本包把
  # 「一次原子操作 / 条件更新 / CAS 循环」收成代码级约定（Backend 三原语），
  # Board/Store 的全部判定逻辑落成原语之上的**单份适配器**：宿主接新后端
  # 的工作量从「重写 29 条契约语义」缩成「实现三个原语 + 让它们真的原子」。
  # 内存后端是测试保底（单进程，不得上生产——边界刻在类型文档里）。
  #
  # worker（issue #106）：Worker Runtime 的生命周期契约与驱动。delegate/
  # taskboard 都不含「执行子任务的 worker 自己怎么活」——注册/心跳/领取/
  # 续期/恢复/优雅退出此前各宿主各写一套。心跳接 RenewingBoard.Renew
  # （续期是资格检查，租约易主即取消在途——危险窗口在施加之前封口）；
  # 进程内注册表参考实现 MemRegistry 在本包（单进程演示 + 契约用例；
  # 跨进程落库归宿主），端到端演示在 examples/worker-runtime。
  #
  # scheduling（issue #108）：Agent 调度的**判据面**（优先级/公平/配额/背压）。
  # 归属结论见 docs/adr/ADR-0008（证据：上游 oagentkit/agent/dispatch 的全部
  # 判定面是 allow 矩阵 + 深度 + 自派发，四样判据上游确实没有）；本包不实现
  # 队列、不判可达性——与 dispatch 门面正交，不与上游并存第二份实现。
  - id: coord
    roots: [coord]
    requires: [sideeffect, taskboard, tenant, "ext:github.com/oekit/concurrency", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      协调后端适配形态约定（Backend 三原语 + Board/Store 单份适配器 + 原子性
      边界文档）。判定逻辑归本包，跨进程原子性归宿主的后端实现——内存后端
      只垫在判定逻辑与契约套件之间（boardtest/sidetest 在适配器上真跑），
      不得上生产。

  - id: worker
    roots: [worker]
    requires: [taskboard, sideeffect, checkpoint, "ext:github.com/oekit/concurrency", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      Worker 生命周期契约（Registry 注册/心跳/注销）与驱动（Loop 六段生命周期）。
      心跳与续期接 taskboard 的租约续期（Renew = 资格检查不是心跳摆设）；
      恢复（Recover）判资格不判时钟——过期判定归任务板侧，不建第二套时钟判据。
      注册表的进程内参考实现 MemRegistry 也在本包（单进程演示 + 契约用例；
      跨进程落库归宿主，内核零数据库依赖），端到端演示在 examples/worker-runtime。

      受管执行器（managed.go，issue #191）只做编排：Claim → sideeffect.Runner
      （Acquire/执行意图/栅栏/结果未知）→ checkpoint.Committer（单调提交）→
      Complete（凭令牌）。不发明第二套状态机：四步各自的判据仍在
      taskboard / sideeffect / checkpoint 里，本包只决定既有结论触发哪个既有动作。
      UNCERTAIN 不落到任务板状态上（任务板没有也不该有该状态）：不 Complete、
      释放租约，由副作用闸继续挡住重试。

  - id: scheduling
    roots: [scheduling]
    requires: ["ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      Agent 调度判据面：优先级排序（确定性平局裁决）、加权公平份额、
      资源配额账本（账平判据：整单占用 / 超释放拒）、背压裁决（拒绝必须带
      机器可判的原因）。纯函数面，不做队列不做执行；可达性/深度归上游
      oagentkit/agent/dispatch（原 dispatch 门面 v0.35.0 已整包删除）。
      多副本配额原语 QuotaStore（Reserve/Release 存储侧原子预占；issue #189）
      + 悬挂预占回收协议（ReserveLease/Reclaim/SweepExpired；归属 TaskID/Owner、
      有效期 Until、任务租约判定面 TaskLeaseOracle；issue #267）是接口 +
      MemQuotaStore 进程内参考实现，跨进程落库归宿主。

  # ── 2026-11-15 新增（issue #169 #170，下沉提案落地）─────────────────
  #
  # dispatch（issue #169）：派发域的**失败面**——多执行者编排的第四问
  # 「失败后还能不能再派、派给谁」。三档分类词表（transient 可跨域兜底 /
  # fatal 换谁白跑直接终态 / other 仅同域重试）+ 两级判定（上游
  # toolgate/policy.Disposition 单源优先，链与协议层都 Unknown 才落文本兜底，
  # 状态码判定带 \b 词边界）+ 改派环骨架（候选枚举与执行步经回调注入）。
  # 不是可达性门面：v0.35.0 起 facades 清单为空，本包是新立的机制包，
  # 不碰 allow 矩阵 / 深度上限 / 自派发三条判定（那三条在上游）。
  #
  # deadline（issue #170）：会话级墙钟时限——shared 锚点跨续跑轮不刷新
  # （总时限不因续跑轮重置）、轮 ctx 携带专属 ErrSessionDeadline、与用户
  # 取消/进程停机三分（timed_out 臂先于停机臂）、过期锚点认领后立即收敛
  # 不进编排。与 budget（压力面）、drain（进程生命周期排水）各占一根轴，
  # 互不改判据。
  - id: dispatch
    roots: [dispatch]
    requires: ["ext:github.com/oagentkit/toolgate", "ext:github.com/oagentkit/guardx", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      改派错误分类与同域/跨域兜底策略（issue #169）：Classify 两轴映射
      （处置类 → 换执行者有无意义）、四级数据化策略解析（条目 > 表级 >
      conf > 代码缺省）、StickyFailover 改派环骨架。判定面只读首次失败的
      原始错误（改派说明只进事件与最终消息）；候选集经 FailoverCandidates
      接缝注入，与宿主注册表/能力画像无关。

  - id: deadline
    roots: [deadline]
    requires: [contract, steer, "ext:github.com/oekit/pkg"] # 收尾路由消费 steer.ErrSteered 接管臂（issue #355）
    owner: harness
    managed: true
    notes: |
      会话级墙钟时限（issue #170）：锚点三态（未写/有效/过期）纯函数、
      轮 ctx 装饰（WithTimeoutCause 携带专属 ErrSessionDeadline）、五路收尾
      路由（接管 / timed_out 先于停机臂 / 用户取消 / 停机 / 未取消）、锚点
      持久化注入接口（首轮写一次、续跑轮读）。**路由表唯一一份**（issue #355）：
      finalize.Route 只做 Outcome→Action 投影，不再另写 cause 判定与臂序。
      消费 contract.StatusTimedOut 词表与 contract.ErrUserCancelled 哨兵；
      与 drain.ErrDeadline 是两个 Cause。

  - id: worker-runtime-ref
    roots: [examples/worker-runtime]
    requires: [coord, taskboard, worker, "ext:github.com/oekit/concurrency", "ext:github.com/oekit/pkg"]
    owner: harness
    managed: true
    notes: |
      Worker 生命周期的参考实现（package main，issue #106）：内存注册表 +
      coord 任务板 + Loop 全生命周期端到端演示（含崩溃恢复接管）。它是
      **示例**不是能力包——机制面在 worker/coord/taskboard，本目录只演示
      怎么接线；注册表落库归宿主的跨进程存储。

  # ── 2026-11-15 新增（issue #167 #168，收尾域下沉提案；登记先于代码）──
  #
  # 两个收尾域机制包，都是「contract 词表的消费算法」——词表在内核，
  # 「怎么安全地迁过去」的算法此前散在各宿主，各迁一套必然漂：
  #
  # finalize（issue #167）：Cause→终态四分路由（接管不落终态回 created /
  # 用户取消 cancelled / 会话超时 timed_out 先于停机分支 / 进程停机不落终态
  # 留给恢复循环）+ 其余 failed + 排队重试裁决，外加三条并发纪律（detached
  # 写 / 零行=他路已接手不写 / 多起点收敛 + 0 行回读补发不谎报）。
  # gorm/model 不下沉：条件迁移、回读现终态、发事件全走注入接口；
  # 报告文案、needs_review 标记、排队结算留宿主回调。
  #
  # steer（issue #168）：运行中接管五件套——ErrSteered 协作中止 Cause
  # （与用户取消/停机可区分）+ 保产摘要（已完成环节机械拼接，不调 LLM）+
  # 不落终态回可认领态 + 队列感知（有排队条目才回 created，否则按失败收敛
  # 不开空轮）+ 条件迁移单协程执行（无双跑窗口）。判据只依赖可注入事实
  # （完成环节清单 / 队列非空与否 / 条件迁移结果），零领域词。
  #
  # 两包依赖方向是**单向**的：finalize → deadline → steer（cause 判定单源在
  # deadline，它消费 ErrSteered 哨兵；finalize 只做 Outcome→Action 投影），
  # steer 不得 import finalize/deadline——接管臂的 Cause 由 steer 产出、由
  # deadline 路由消费、由 finalize 投影，反向成环即门禁红。
  - id: finalize
    roots: [finalize]
    requires: [contract, deadline, "ext:github.com/oekit/logx", "ext:github.com/oekit/pkg"] # 路由目标词表来自 contract；cause 判定/臂序单源在 deadline（issue #355）；留痕走 logx.Delegating；哨兵/判定用 pkg/errors
    owner: harness
    managed: true
    notes: |
      收尾漏斗（issue #167）：Route（**投影 deadline.Route** 的 Outcome→Action，
      路由表与臂序不在本包第二遍）+ Converge（多起点条件迁移 + 零行判定 +
      0 行回读补发不谎报）+
      AdjudicateRetry（失败臂排队重试裁决）+ Detached（脱离 ctx 派生）。
      三条并发纪律是包级不变量（写进包头与用例）：① 终态写一律走脱离 ctx——
      编排 ctx 已取消时存储直查中止 ⇒ 会话滞留 running 而事件谎报；② 条件
      迁移零行 = 他路已接手，不再写任何状态；⑃ 多起点（running/waiting_approval
      双起点，挂起期写丢失时只认 running 起点的终态写零行 ⇒ 永不入终态）+
      零行回读库内现终态补发事件「不谎报」。
      与 drain 的分工（互指）：drain 只管停机臂在途轮收敛且明写「不写终态」——
      「停机不落终态」这条 case 的归属地正是本路由表。接管臂（ErrSteered）的
      载荷与续跑语义在 steer，本包只管路由到那一臂。
  - id: steer
    roots: [steer]
    requires: [contract, "ext:github.com/oekit/logx", "ext:github.com/oekit/pkg"] # 回迁目标与「环节成功」判定词表统一消费 contract（statemachine 常量是别名，issue #357）；队列读失败留痕走 logx；哨兵/判定用 pkg/errors
    owner: harness
    managed: true
    notes: |
      运行中接管（issue #168）：ErrSteered 协作中止 Cause + Signal/IsSteered
      （带 Cause 的 ctx 取消，与用户取消/停机可区分）+ BuildSummary（已完成
      环节机械拼接，不调 LLM——收尾在脱离 ctx 里跑，须快且不引入新失败面，
      读取失败走降级文案）+ Decide（队列感知：有排队条目回 created，否则按
      失败收敛不开空轮）+ Run（条件迁移单协程执行，零行 = 他路已接手静默，
      并发投喂恰有一个赢家）。与 finalize 的接缝：steer 产出 Cause、finalize
      消费（单向依赖，不许环）；finalize 管「往哪收」的路由，steer 管接管臂
      「怎么收与怎么续」。与 handoff（跨进程负责人字段改写）/ taskboard 的
      「接管」（租约过期被动重跑）/ drain（进程要死了的排水）三处同词不同域，
      包头互指。
  - id: roundguard
    roots: [roundguard]
    requires: ["ext:github.com/oekit/pkg"] # 零内部依赖：哨兵/错误用 pkg/errors；budget/cost/deadline/watchdog 是平级的不同量纲，互相不引
    owner: harness
    managed: true
    notes: |
      回合守卫：模型侧循环的回合结局分类 + 次数预算 + 无进展检测 + 组合结论 Decide。
      零内部依赖是刻意的——budget/cost/deadline/watchdog 是**平级的不同量纲**，
      互相不引（引了就成环，且两处口径会漂）。回合结局是**第三根轴**，
      不复用 contract 会话状态 / statemachine 环节状态。

# ── 可执行规则 ──
rules:
  # 规则一（拆分后的头号红线）：harness 不得出现领域词。
  # 拆分做完后最现实的风险不是拆不动，而是业务代码一年年渗回内核，
  # 等发现时 harness 已经退化成「换了个名字的 monolith」。用门禁把它钉死。
  #
  # 分两级执行，避免门禁虚红导致被习惯性忽略：
  #   - 生产代码（ignore_test: true）→ severity: error，违反即红；
  #   - 测试夹具（only_test: true） → severity: warn，只报告不阻断。
  - id: harness-no-domain-vocabulary
    desc: 内核生产代码不得含运维领域词表（词表属于宿主/领域包）
    severity: error
    scope: [.]          # 全仓
    include: ["*.go"]
    ignore_test: true   # 测试夹具由下一条规则单独体检
    scope_exclude: [cmd]
    forbid_regex: '(故障链|巡检流|故障诊断|告警|根因分析|运维|主机构建|本机|远程主机|集群健康|节点诊断|内存分析|IO\s*分析|网络分析|安全基线|变更管控|处置验证|审批单|工单)'
    examples:
      - text: 'var steps = 故障链判定()'
        want: hit
      # 分支覆盖（issue #386）：词表里**每一个**备选词各一条正例。
      # 只钉第一条时，其余词被删掉/改名后门禁仍然全绿——失效形态是变绿。
      - text: 'var s = "巡检流"'
        want: hit
      - text: 'var s = "故障诊断"'
        want: hit
      - text: 'var s = "告警"'
        want: hit
      - text: 'var s = "根因分析"'
        want: hit
      - text: 'var s = "运维"'
        want: hit
      - text: 'var s = "主机构建"'
        want: hit
      - text: 'var s = "本机"'
        want: hit
      - text: 'var s = "远程主机"'
        want: hit
      - text: 'var s = "集群健康"'
        want: hit
      - text: 'var s = "节点诊断"'
        want: hit
      - text: 'var s = "内存分析"'
        want: hit
      - text: 'var s = "IO 分析"'
        want: hit
      - text: 'var s = "网络分析"'
        want: hit
      - text: 'var s = "安全基线"'
        want: hit
      - text: 'var s = "变更管控"'
        want: hit
      - text: 'var s = "处置验证"'
        want: hit
      - text: 'var s = "审批单"'
        want: hit
      - text: 'var s = "工单"'
        want: hit
      - text: 'var buf bytes.Buffer'
        want: miss

    # 说明：以上均为**运维领域中文词**。刻意不拦 host/cluster/pod 等通用技术词——
    # 它们在协议字段名（如 ImpactScopes 的 host 级）中合法出现，硬拦会误杀。
    # 判定范围只覆盖「词表/编排图」语境：真正的机制判定（如深度上限、allow 矩阵）
    # 用词是通用的。

  - id: harness-test-fixture-domain-vocabulary
    desc: 测试夹具必须使用合成数据，不得携带真实运维词面
    # 2026-10-18 由 warn 升为 error。长期挂着 warn 的规则等于没有规则——债务
    # 清零后若还留在 warn 级，同一批词面可以无声回涨，且没人会去看告警清单。
    # 清偿记录：15 处 warn 级债（protocol 11 + watchdog 4）已全部改为合成数据，
    # 规则报告归零后才做的这次升级。
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: false
    only_test: true
    scope_exclude: [cmd]
    forbid_regex: '(故障链|巡检流|故障诊断|告警|根因分析|运维|本机|远程主机|集群健康|内存分析|IO\s*分析|网络分析|安全基线|变更管控|处置验证|工单)'
    examples:
      - text: 'name := "运维Agent"'
        want: hit
      # 分支覆盖（issue #386）：词表里**每一个**备选词各一条正例。
      # 「运维」由上面那条正例钉住；下面补齐其余词。
      - text: 'name := "故障链"'
        want: hit
      - text: 'name := "巡检流"'
        want: hit
      - text: 'name := "故障诊断"'
        want: hit
      - text: 'name := "告警"'
        want: hit
      - text: 'name := "根因分析"'
        want: hit
      - text: 'name := "本机"'
        want: hit
      - text: 'name := "远程主机"'
        want: hit
      - text: 'name := "集群健康"'
        want: hit
      - text: 'name := "内存分析"'
        want: hit
      - text: 'name := "IO 分析"'
        want: hit
      - text: 'name := "网络分析"'
        want: hit
      - text: 'name := "安全基线"'
        want: hit
      - text: 'name := "变更管控"'
        want: hit
      - text: 'name := "处置验证"'
        want: hit
      - text: 'name := "工单"'
        want: hit
      # 断言「不得出现某词」的测试意图必须能写出那个词——negative_follow 的
      # 豁免面在这里被样例钉住：锚点写错一个字，这条会从 miss 变 hit。
      - text: 'if strings.Contains(out, "运维") {'
        want: miss

    # 负向前置：**断言「不得出现某词」的用例**本身必须写出那个词，否则无法断言。
    # 这类命中是测试意图而非领域知识，用 negative_follow 结构化豁免（RE2 无后顾断言）。
    # 升 error 后此豁免更关键：protocol/generality_test.go:87 正是断言
    # 「渲染结果不得含『运维』」，没有豁免它会被自己这条规则拦下。
    negative_follow:
      - anchor: 'strings.Contains(out, "'
        forbid_follow: '运维")'
      - anchor: '!strings.Contains(out, "'
        forbid_follow: '运维")'

  # 规则二：harness 不得反向依赖宿主。这是拆分的定义性约束——
  # 一旦 harness import 宿主仓，harness 就永久绑死在运维域上。
  #
  # 两个前缀都要列：宿主仓 2026-10-18 起在 GitHub 上有正式仓
  # yi-nology/bianque，只拦旧私有域名等于给新路径开后门——
  # module path 迁到 github.com/yi-nology/ 之后，import 宿主完全绕得过去。
  - id: harness-no-host-dependency
    desc: 内核不得依赖宿主仓任何包
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: false
    scope_exclude: [cmd]
    # 匹配对象是 **import 路径**（不含引号），不是源码行——实现走 go/ast，
    # 单行/块/别名/空白导入一视同仁（见 archcheck/imports.go）。
    #
    # 路径末尾用 `(/|$)` 而不是裸 `/`：宿主仓的**根包** import 路径没有结尾斜杠
    # （github.com/yi-nology/bianque），只写 `/` 会漏掉它——而那恰恰是最可能被
    # 直接引用的那个包。漏掉的形态是门禁变绿，不是变红。
    forbid_import_regex: 'git\.enjoye\.top/enjoydream/bianque(/|$)|github\.com/yi-nology/bianque(/|$)'
    examples:
      - text: 'github.com/yi-nology/bianque/internal/engine'
        want: hit
      # 分支覆盖（issue #386）：旧私有域与 github 两个前缀、以及 (/|$) 两种
      # 结尾都必须各有一条正例。只钉 github 子包时，私有域分支被删掉门禁无感。
      - text: 'git.enjoye.top/enjoydream/bianque/internal/engine'
        want: hit
      - text: 'git.enjoye.top/enjoydream/bianque'
        want: hit
      - text: 'github.com/yi-nology/bianque'
        want: hit
      - text: 'github.com/oekit/pkg/errors'
        want: miss


  # 规则三：harness 包不得依赖宿主的运行时原语库。
  # 2026-10-18 起**不再允许门面 agentkit**（上游私有旧门面仓）：
  # 该门面已发至 v1.0.0 并进入退役期，agent 原语统一走 github.com/oagentkit/<mod>。
  # 门禁不认「文档里说过要迁」——不写进机器约束的约定半年后必然回退。
  # 同规则二：新旧两个宿主前缀都列，理由见上。
  - id: harness-no-domain-runtime-deps
    desc: 内核不得引入宿主仓与领域运行时（含已退役的 agentkit 门面）
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: true
    scope_exclude: [cmd]
    forbid_import_regex: 'git\.enjoye\.top/enjoydream/(bianque|ekit|agentkit)(/|$)|github\.com/yi-nology/(bianque|ekit|agentkit)(/|$)'
    examples:
      - text: 'github.com/yi-nology/ekit/flow'
        want: hit
      # 分支覆盖（issue #386）：2 域 × 3 仓 × 2 结尾。每个域名、每个仓名、
      # 每种结尾都至少被一条正例钉住——删掉任意一支都必须有正例变红。
      - text: 'git.enjoye.top/enjoydream/bianque/internal/flow'
        want: hit
      - text: 'git.enjoye.top/enjoydream/ekit/internal/flow'
        want: hit
      - text: 'git.enjoye.top/enjoydream/agentkit/internal/flow'
        want: hit
      - text: 'git.enjoye.top/enjoydream/ekit'
        want: hit
      - text: 'github.com/yi-nology/bianque/internal/flow'
        want: hit
      - text: 'github.com/yi-nology/agentkit/internal/flow'
        want: hit
      - text: 'github.com/yi-nology/ekit'
        want: hit
      - text: 'github.com/yi-nology/goagent-kernel/protocol'
        want: miss


  # ── oekit 家规（矩阵一致性）──
  #
  # goagent-kernel 与 oekit 同属一族：oekit=基础库、agentkit=agent 原语、
  # harness=编排内核，三者本该是同一套工程纪律下的产物。harness 曾是矩阵里唯一
  # 不守家规的孤岛——家规只写在别处的文档里，本仓既不执行也不自查。
  #
  # 这三条都不是风格洁癖，每条都对应一个真实故障模式：
  #   - 裸 goroutine 的 panic 无法被外层 recover，会直接杀掉整个进程；
  #   - printf 日志回调一旦焊进公开 API 签名就是不可逆的 API 债；
  #   - 进程内混用第二套 errors 包会打断 BizError 的 As/Is 判定（Not Found 变 500）。

  # 规则四：禁止裸 go func，走 concurrency/async 的 GoSafe（panic 被 recover）。
  - id: harness-no-bare-goroutine
    desc: 生产代码禁止裸 goroutine 启动（panic 无法被外层 recover，会杀进程）；须走 concurrency/async 的 GoSafe
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: true   # 测试需要真 goroutine 来验证阻塞/超时语义，不适用
    # 两种形态都要拦：`go func(){...}()` 与 `go someFunc()`。
    #
    # 旧写法只拦 `go func(`，漏了 `go someFunc()`——而后者的 panic 同样
    # **无法被外层 recover 捕获**（panic 发生在被调函数内部，裸 goroutine 没有
    # 任何 recover 边界），风险与前者完全相同。漏掉的形态是门禁变绿。
    # 第三种形态也拦得住：`go m.Start()` 这类**方法调用**。旧正则要求标识符后
    # 紧跟 `(`，于是带点的调用链整体不命中——而它的 panic 同样无法被外层 recover。
    # 这一处是 examples 自检上线当天抓出来的（正例 `\tgo worker.Start()` 判不中）：
    # 判据比它自己的注释窄，而注释是散文、examples 才是断言。
    forbid_regex: '^\s*go\s+(func\(|(?:[A-Za-z_]\w*\.)*[A-Za-z_]\w*\()'
    examples:
      - text: "\tgo func() {"
        want: hit
      # 第二种形态也必须判得中：裸 goroutine 的 panic 无法被外层 recover，
      # 与是不是匿名函数无关（漏掉这一形态是旧实现的漏洞）。
      - text: "\tgo worker.Start()"
        want: hit
      - text: "\tgoFunc := 1"
        want: miss


  # 规则（issue #428）：用例内起的 goroutine 必须在用例返回前被等待。
  #
  # 形态：测试函数里 go 了某个东西，而**测试侧**没有任何等待点 ⇒ goroutine
  # 可能在用例返回后仍在跑，撞上用例交还资源的那道窗口（关存储 / 删临时目录）。
  # 典型症状是 SQLite(WAL) 在已删目录里重建 -wal/-shm ⇒ t.TempDir() 的
  # RemoveAll 报 directory not empty（负载依赖型，单跑不复现）。
  #
  # 这条纪律在 v0.51.0 已由人工落到 9 处用例上，但**没有任何规则在查** ⇒ 同一个
  # 形态可以随时再长出来。这条规则把那条纪律变成门禁。
  #
  # 判据走 **go/ast**（check_kind: goroutine_join），不走正则：这条规则判的是
  # 「用例体内有没有 go 语句」与「测试侧有没有等待点」两件**结构**的事，逐行正则
  # 既认不全 go 语句的形态，也认不全等待点的形态。
  #
  # 等待点 = 接收表达式 <-ch，或调用 X.Wait()；**包内助手**（同目录同包名，
  # 深度 ≤2）里的等待点同样算数——收尾助手是本仓惯用范式
  # （examples/sqliteadapter 的 stopTailer：cancel → <-done → 超时兜底），
  # 只按用例体判会把已经修好的用例判成违规（误报到没人信它 = 门禁等于没有）。
  - id: harness-test-goroutine-joined
    desc: 用例内起的 goroutine 必须在用例返回前被等待（测试侧无等待点即违规）
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: false
    only_test: true
    check_kind: goroutine_join
    examples:
      # ① 违规形态：起了 goroutine，测试侧完全没有等待点 ⇒ hit。
      - text: |-
          package sample

          func TestLeak(t *testing.T) {
              go worker()
          }
        want: hit
      # ② 合规形态：用例体内直接 <-done 等它 ⇒ miss。
      - text: |-
          package sample

          func TestJoined(t *testing.T) {
              done := make(chan struct{})
              go func() { close(done) }()
              <-done
          }
        want: miss
      # ③ 助手形态：收尾助手在同包函数里等 ⇒ miss。
      - text: |-
          package sample

          func TestViaHelper(t *testing.T) {
              done := make(chan struct{})
              go func() { close(done) }()
              stopIt(done)
          }

          func stopIt(done <-chan struct{}) {
              <-done
          }
        want: miss
      # ④ 长得像等待、其实不是：<-ch 写在**被启动的那个 goroutine 体内**，
      #    那是它在等别人，不是测试侧在等它 ⇒ hit。
      - text: |-
          package sample

          func TestSelfWait(t *testing.T) {
              ch := make(chan struct{})
              go func() { <-ch }()
          }
        want: hit
      # ⑤ X.Wait() 也是等待点 ⇒ miss。
      - text: |-
          package sample

          func TestWaitGroup(t *testing.T) {
              var wg sync.WaitGroup
              wg.Add(1)
              go func() { defer wg.Done() }()
              wg.Wait()
          }
        want: miss

  # 规则：用例内起的 goroutine 的**收尾等待点**必须写在 defer 里（issue #440）。
  #
  # 兄弟规则 harness-test-goroutine-joined 判的是**静态形状**（「测试侧有没有
  # 等待点」），判不出「那个等待点会不会被 Goexit 跳过」：runtime.Goexit 会
  # 执行所有 defer，但**不执行**它之后的普通语句 ⇒ 用例体末尾的普通语句形式
  # 的等待点，在失败路径上根本不执行 ⇒ goroutine 实际未被 join，而兄弟规则
  # 判它合规。这条边界写在 archcheck/testgoroutine.go 头注的「已知边界第 4 条」，
  # 并注明已开单 #440——本规则把那第 4 条边界关掉。
  #
  # 判据走 **go/ast**（check_kind: defer_cleanup），不走正则：它判的是
  # 「go 语句」「等待点」「defer」「能终止用例的调用」四者的**位置关系**，
  # 逐行正则认不出「这个等待点落在 defer 里吗」。
  - id: harness-test-defer-cleanup
    desc: 用例内起的 goroutine 的收尾等待点必须写在 defer 里（等待点写在普通语句里、且它之前有可终止用例的调用 ⇒ 违规）
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: false
    only_test: true
    check_kind: defer_cleanup
    examples:
      # ① 违规形态：等待点写在普通语句里，而它前面有 t.Fatalf ⇒ Goexit 会跳过它。
      - text: |-
          package sample

          func TestTailWait(t *testing.T) {
              done := make(chan struct{})
              go worker()
              if !ready() {
                  t.Fatalf("没准备好")
              }
              <-done
          }
        want: hit
      # ② 同步等待：等待点之前没有可终止用例的调用 ⇒ goroutine 一定先结束。
      - text: |-
          package sample

          func TestSyncWait(t *testing.T) {
              done := make(chan struct{})
              go worker()
              <-done
          }
        want: miss
      # ③ defer 形态 ⇒ 收尾等待，合规。
      - text: |-
          package sample

          func TestDeferWait(t *testing.T) {
              done := make(chan struct{})
              go worker()
              defer func() { <-done }()
          }
        want: miss
      # ④ defer 调用的包内助手里有等待点 ⇒ 收尾等待，合规。
      - text: |-
          package sample

          func TestDeferHelper(t *testing.T) {
              done := make(chan struct{})
              go worker()
              defer stopIt(done)
          }

          func stopIt(done <-chan struct{}) {
              <-done
          }
        want: miss
      # ⑤ 完全没有等待点：这条规则不判（那是兄弟规则 harness-test-goroutine-joined 的面）。
      - text: |-
          package sample

          func TestNoWait(t *testing.T) {
              go worker()
          }
        want: miss

  # 规则：断言的尺子必须是可观测事实，不是墙钟窗口（issue #441）。
  #
  # 固定睡一段再断言 ⇒ 这段窗口与被测机制的真实节奏无关：机器一忙，窗口里
  # 可能什么都没发生（假红）；被测机制抢跑，断言又可能落在窗口之外（白测）。
  # 两种失效形态的共同点是**结论由窗口长度单独决定**，而不是由可观测事实决定。
  #
  # **显式登记的边界**（写在这里，也写进执行体的文件头与报告）：
  # ① 轮询退避不算尺子——sleep 落在 for/range 循环体内 ⇒ 不判（它的退出条件
  #    是循环条件本身，不是窗口长度）；
  # ② goroutine 体里的 sleep 不判——那是**被测机制自己的节奏**，不是测试侧的尺子。
  #
  # 判据走 **go/ast**（check_kind: wallclock_ruler），不走正则：import 别名、
  # 调用形态、循环形态都要按语法树认。
  - id: harness-test-wallclock-ruler
    desc: 测试面不许拿裸 time.Sleep 当尺子（窗口长度单独决定结论即违规；轮询退避与 goroutine 体里的 sleep 除外）
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: false
    only_test: true
    check_kind: wallclock_ruler
    # 受管的辅助：这些助手函数体内部的 sleep 不判（已单独复核「不是尺子」）。
    # 声明在 policy 侧而不是硬编码在 archcheck 里：archcheck 是跨宿主复用的库，
    # 硬编码辅助名单等于把宿主的事写进内核。
    #
    # 典型形态是「等可观测事实」的助手（如 eventbus.waitTail：它等的是一帧
    # 事件这个事实，不是窗口）。本仓当前登记的两项是**子进程剧本**助手：
    # 它们的 sleep 是「挂住等外部动作」（等父进程 SIGKILL、等屏障绝对时刻），
    # 结论（OUTCOME=…）由外部动作决定，不由窗口长度决定 ⇒ 不是尺子。
    managed_helpers:
      - pgstore.runChildE2E
      - pgstore.runChildSnapshotSave
    examples:
      # ① 违规形态：用例体里的裸 sleep——窗口长度单独决定结论。
      - text: |-
          package sample

          import "time"

          func TestRuler(t *testing.T) {
              time.Sleep(50 * time.Millisecond)
              if !ready() {
                  t.Fatalf("没准备好")
              }
          }
        want: hit
      # ② 轮询退避：sleep 在 for/range 循环体内 ⇒ 退出条件是循环条件，不是窗口。
      - text: |-
          package sample

          import "time"

          func TestPoll(t *testing.T) {
              for i := 0; i < 10; i++ {
                  time.Sleep(10 * time.Millisecond)
                  if ready() {
                      return
                  }
              }
          }
        want: miss
      # ③ goroutine 体里的 sleep 是被测机制自己的节奏，不是测试侧的尺子。
      - text: |-
          package sample

          import "time"

          func TestWorker(t *testing.T) {
              go func() {
                  time.Sleep(30 * time.Millisecond)
                  close(done)
              }()
          }
        want: miss


  - id: harness-no-printf-log-callback
    desc: SDK 包不得把 printf 风格日志回调焊进公开 API 签名；留痕走 logx.Delegating
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: false
    scope_exclude: [cmd]
    # 匹配「名为 logf/logFunc/logFn/logger 的参数，其类型是 func(...) 且**首参为 string**」。
    #
    # 首参允许带参数名（`func(format string, args ...any)`）——那才是 printf
    # 回调的常见写法。旧写法 `func\(string` 只认「首参无名的裸 string」，
    # 于是最常见的那种形态（带参数名的 format string）反而漏检。
    forbid_regex: '\b(logf|logFunc|logFn|logger)\s+func\(\s*(?:[A-Za-z_]\w*\s+)?string\b'
    examples:
      # 最常见的那种形态：首参**带参数名**的 format string。
      - text: 'func New(logf func(format string, args ...any)) *X {'
        want: hit
      # 分支覆盖（issue #386）：4 个回调名各一条正例。regexp/syntax 会把
      # logf|logFunc|logFn|logger 做公因子分解，只钉 logf 时其余名字被删掉
      # 门禁不会变红。
      - text: 'func New(logFunc func(format string, args ...any)) *X {'
        want: hit
      - text: 'func New(logFn func(format string, args ...any)) *X {'
        want: hit
      - text: 'func New(logger func(format string, args ...any)) *X {'
        want: hit
      - text: 'func New(log func(string) error) *X {'
        want: miss


  # 规则六：类型同一性红线——一个进程只允许一套 errors 包。
  # **2026-10-18 已清偿**：oekit/pkg ≥ v0.12.0 起 New/As/Is/Unwrap 与 stdlib 同型透传
  # （`errors.New` 就是 `stderrors.New` 的 shim，见 pkg/errors/std.go），哨兵与 As 判定
  # 单 import 即可，双 import 的老理由已消失，全仓 24 个文件已切换完成。
  #
  # 因此本规则从「只拦第二套」**收紧为「只允许 oekit/pkg/errors 一套」**：
  #   - `^errors$`                   → 禁 stdlib（按**路径**精确匹配，不是子串，
  #                                    否则 github.com/x/errors 之类会被误伤）
  #   - `^github\.com/pkg/errors$`   → 禁同名不同型的第三方包
  # 匹配对象是 import 路径（实现走 go/ast），故单行/块/别名/空白导入一视同仁。
  #
  # 旧实现用 `^\s*"errors"$` 逐行匹配源码文本，只认「整行就是一个裸路径」，
  # 于是 `import "errors"`（单行）、`import e "errors"`（别名）全部漏检——
  # 而本仓大量使用单行 import，这条规则对相当一部分文件从来没生效过。
  - id: harness-single-errors-package
    desc: 全仓只允许 oekit/pkg/errors 一套 errors 包（禁 stdlib errors 与 github.com/pkg/errors）
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: false
    scope_exclude: [cmd]
    forbid_import_regex: '^errors$|^github\.com/pkg/errors$'
    examples:
      - text: 'errors'
        want: hit
      # 分支覆盖（issue #386）：第二套 errors 包必须自己有一条正例。
      # 只钉 stdlib 时，把 `^github\.com/pkg/errors$` 删掉门禁仍然全绿——
      # 「只允许一套」的收紧会静默退回「只拦 stdlib」。
      - text: 'github.com/pkg/errors'
        want: hit
      # 同一套 errors 在 oekit 里是**允许**的那一套（路径不同即类型不同）。
      - text: 'github.com/oekit/pkg/errors'
        want: miss


  # 规则八（2026-10-21）：外部程序执行的入口必须唯一。
  #
  # 隔离档位这套机制要成立，前提是「被执行的程序都在某个已登记的后端里跑」。
  # 一旦某个包绕过登记簿直接起一个外部进程，那次执行就没有档位——宿主按
  # 「它在受控后端里」做的风险判断，对那次执行全部落空，而**没有任何信号**：
  # 构建全绿、测试全绿、审计日志里只有一条普通的进程记录。
  #
  # 这类绕过最常见的形态是 os/exec（Go 里起外部进程的标准入口），加进某个包
  # 只要一行。于是本规则把「起外部进程」这件事**收口到 ptc 执行面**，
  # 其余生产代码一律不得直接 import。
  #
  # 判定面是 **import 路径**（走 go/ast），故单行/块/别名/空白导入一视同仁。
  #
  # 已知边界（写明，而不是假装覆盖）：本规则只拦 os/exec 这一个标准入口。
  # 直接用 syscall 起进程的形态拦不住——那需要拦整个 syscall 面，代价远大于
  # 收益，且当前本仓生产代码零 os/exec。规则拦的是**常见形态**，不是全部形态。
  - id: harness-sandbox-execution-single-entry
    desc: 外部程序执行只允许经 ptc 执行后端；其余生产代码不得直接 import os/exec
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: true
    # 收口点从 sandbox 迁到 ptc（sandbox 门面包已删，档位语义直连 guardx），
    # 而「起外部进程」这件事的实现落在 ptc 的子进程后端（ptc-subprocess）。
    # 收口**一处**的意图不变——仍是「只有一个包能 import os/exec」，
    # 只是那个包从「sandbox 执行面」变成了「ptc 执行面」。
    scope_exclude: [cmd, ptc]
    forbid_import_regex: '^os/exec$'
    examples:
      - text: 'os/exec'
        want: hit
      - text: 'os'
        want: miss

  # 规则：工具配对键只允许经 eventbus.ToolCallID 读取（issue #336）。
  #
  # 失效形态是**两处各自构造配对键**：watchdog 用 session|step|call_id、
  # trajectory 用全局 call_id，同一份事件流于是得出相反结论（一侧报「结果
  # 无对应声明」、另一侧判「已配对」），而两边都不会报错。判据面只认唯一的
  # 构造函数——配对键是事件载荷契约的一部分，契约的读取点必须单源。
  #
  # 判定面是源码文本里的**载荷索引**（`Payload["call_id"]`），不是 map 字面量
  # （测试夹具构造事件载荷用 `"call_id": x`，不受影响）。eventbus 是构造函数
  # 的宿主，豁免；其余包（含生产与测试代码）一律不得直接索引。
  - id: tool-pairing-key-single-source
    desc: 工具配对键（call_id）只允许经 eventbus.ToolCallID 读取（两处各写一份 ⇒ 同一事件流两个相反结论）
    severity: error
    scope: [.]
    include: ["*.go"]
    ignore_test: false
    scope_exclude: [eventbus]
    forbid_regex: 'Payload\s*\[\s*"call_id"\s*\]'
    examples:
      - text: 'callID, _ := ev.Payload["call_id"].(string)'
        want: hit
      - text: 'callID := eventbus.ToolCallID(ev)'
        want: miss


# ── 门面包不可变 ──
#
# 规则七（AST 类，**不在 rules 段**）：门面包只能是门面。
#
# 为什么单独一段而不是加进上面的 rules：rules 段是正则门禁，逐行看文本；「一个函数
# 体是不是只有一条上游转发」是结构性问题，只有语法树能判。执行体在 archcheck/
# facade.go，走 go/ast，不参与正则表。
#
# 为什么必须拦：docs/OAGENTKIT-OVERLAP.md 用散文写了「保持门面，别再在本仓加逻辑」。
# 散文不是门禁。现有七条正则规则查的全是写法（用什么词、import 什么、goroutine 怎么起、
# 回调怎么声明、errors 怎么包），没有一条查「本仓自己的门面有没有被自己改胖」。真有人
# 往 policy/ 里加一份实现，没有规则会响，结果是与上游并存的第二份实现——正是该文档
# 警告的事，却只靠一句人话拦着。
#
# 允许的四类声明（其余一律违规）：
#   type X = upstream.X                      类型别名
#   const X = upstream.X                     常量别名（可成块）
#   func X(...) T { return upstream.F(...) } 单条上游转发
#   import 路径 ∈ upstream ∪ allowed_imports
#
# 「加真逻辑」三者必居其一——要新类型、要多条语句、或要新依赖——所以这条规则不能被
# 「顺手写两行」绕过去。测试文件不在判定面内（构造违规样例本身就是验证手段）。
#
# severity 直接给 error：这三条门包当前零违规，说明纪律还没被破坏过；挂在 warn 上
# 等于给未来的回涨留后门。升 error 前已做反向验证（见 facade.go 包头注释）。
#
# v0.35.0：五个门面包（dispatch/policy/reminder/toolfail/sandbox）整包删除，
# 消费方直连上游（oagentkit/agent·toolgate·guardx）。清单置空——规则与执行体
# 保留，本仓若再设门面包，按上述四类合法形态登记即可。
facades: []

# ── 包间依赖方向 ──
#
# modules 段的 requires 此前**只有声明、没有执行体**：archcheck/policy.go 把 modules
# 反序列化成 `[]struct{}`，requires 连内存都没进，于是 README 宣称的
# 「域词污染 + 依赖方向」里「依赖方向」那一半是空的。且声明已经开始漂移
# （watchdog 写 requires: []，实际 import 了 eventbus）——没人发现，
# 因为没有东西会去读它。执行体见 archcheck/deps.go（go/ast 判 import）。
#
# 为什么值得做成门禁：依赖缠绕是本仓最难靠 review 发现的债。它零报错、零告警、
# 构建全绿——每个单点 import 看起来都合理，只有把全图摊开才看得出 A→B→C→A。
# 其余七条正则规则查的全是「写法」（用什么词、import 什么、goroutine 怎么起），
# 没有一条查「包与包之间允许连成什么形状」。
#
# 判定路径三条：
#   1. 越界依赖：包 A 的生产代码 import 了包 B，而 A 的 requires 未登记 B。
#   2. 越界跨仓依赖：A import 了落在**受管外部包面**内的包，而 A 的 requires
#      未登记它（登记形态：`ext:<import 路径前缀>`）。
#   3. 未登记包：含生产 Go 文件的**包目录**未被任何 root 覆盖——未登记的包对本门禁
#      隐形，任何模块都能 import 它而不被判违规。这是该规则最大的盲区。
#
# requires 的条目有两种形态：
#   - `<模块 id>`：本仓内部模块，必须在 modules 段登记过（写错 id = policy 解析失败，
#     不静默降级——否则「这条边是否被允许」变成永远为假的判定）。
#   - `ext:<import 路径前缀>`：外部包面，用于表达跨仓依赖。机制面迁到外仓之后，
#     宿主的依赖拓扑表需要能表达「我依赖外仓的哪个包」，而只认本仓模块 id 的判据
#     表达不了。登记后该前缀成为受管包面，任何模块 import 落在其中却没登记 → 越界。
#
# 判定面只含生产代码（跳过 _test.go）：依赖方向决定交付物里出现什么，测试依赖
# 是临时的、可随用例删掉的；纳入测试会逼出「只为共享夹具而做的注册」噪声，
# 反而削弱规则可信度。
#
# severity 直接给 error：登记项当前零违规（声明与代码事实一致后才允许升 error），
# 挂在 warn 上等于给未来回涨留后门。已做反向验证（注入越界依赖 / 未登记目录
# → 门禁报错 + 退出码 1）。
dependency_direction:
  enabled: true
  severity: error
  desc: 包间依赖必须先在 modules 段登记 requires；跨仓依赖用 ext:<import 路径前缀> 登记；未登记的包目录对门禁隐形，须补登记
  # 豁免**逐包列举**，不给目录前缀（issue #35）。
  #
  # 前缀豁免的通病是「今天写它时只想着两个包，明天多一个也没人重新判断」。
  # 本仓真实发生过：这行原写 `[cmd, docs]`，理由写的是「archcheck / docsync 是
  # 工具包」；而当时 cmd/ 下**已有三个包**，第三个 `ptcchild` 既不是门禁工具也不是
  # 文档工具（它是 ptc 子进程后端的执行入口），却被同一条前缀豁免顺带盖住了，
  # 且没有任何信号——理由点名 2 个、实际豁免 3 个。
  #
  # 逐个列举之后，新增 `cmd/xxx` 会当场报「未登记的包目录」，逼人重新判断它是
  # 什么：是工具（加到这里）、还是值得被依赖方向管住的模块（登记进 modules 段）。
  #
  #   cmd/archcheck、cmd/docsync、cmd/pkgcov  门禁 / 文档工具：import 各包是工具
  #                                            职责，不是机制依赖。
  #   cmd/apilifecheck                        门禁工具（issue #113/#104，2026-11-12）：
  #                                            判 api-lifecycle.yaml ↔ 包注释 ↔
  #                                            覆盖 ↔ 错误登记表；解析各包语法树
  #                                            是工具职责，同上。
  #   cmd/releasecheck                        发版纪律门禁（2026-11-17）：判 annotated tag /
  #                                            CHANGELOG 含本版段 / 无 U+FFFD / 区间内无混装
  #                                            提交；读 git 历史与 CHANGELOG 是工具职责，同上。
#   cmd/deploymatrix                        部署配方能力清单门禁（2026-11-17，issue #277）：
#                                            判 docs/DEPLOY-MATRIX.yaml 的证据可解析、
#                                            state/readiness 由证据推导、USAGE 机器口径块
#                                            逐行一致；解析 Go 符号与 Makefile 是工具职责。
#   cmd/seamcheck                           接缝契约成文率统计与棘轮（2026-11-17，issue #400）：
#                                            类型感知扫描导出 interface / 回调函数类型，
#                                            输出声明/调用点/三条约束写齐数；扫描各包是
#                                            工具职责，不形成机制依赖。
#   cmd/hygiene                         仓库卫生门禁（issue #413，2026-11-18）：
#                                            判「被跟踪的文件里不得有编译产物二进制」；
#                                            读 git 索引与文件头是工具职责，不形成机制依赖。
#   cmd/ledgercheck                      台账纪律门禁（2026-11-18，台账 §15 建议 1）：
#                                            判台账自身的单号状态一致 / 关闭 PR 号形态 /
#                                            无主单号；读台账 markdown 是工具职责，不形成
#                                            机制依赖。它与 cmd/deploymatrix 共读
#                                            internal/ledgerstatus（单号状态的唯一派生器），
#                                            两处各解析一遍必然漂移。
#   cmd/raceprobe                      race 门禁的取证式看门狗（2026-11-19，台账 §26）：
#                                            起 go test 子进程、判失败形态（数据竞争 /
#                                            用例挂死 / 启动期楔死）、落取证；起子进程
#                                            与读输出是工具职责，不形成机制依赖。
#   cmd/storagecheck                    存储选型判据门禁（2026-11-19，issue #424）：
#                                            判 docs/STORAGE-SELECTION.yaml ↔ 部署矩阵场景
#                                            ↔ 代码落点（go/ast 判符号声明）；读声明面与
#                                            解析 Go 符号是工具职责，不形成机制依赖。
#                                            它与 cmd/deploymatrix 分开：后者判「能力齐不齐」
#                                            （红在缺能力），本门禁红在「选错引擎」——
#                                            两件事的失败形态不同，混在一起会让「哪个门禁
#                                            在管我」变得不可追。
#   （cmd/ptcchild 不在此列——它已作为模块登记在 modules 段，见该条 notes）
  ignore_dirs: [cmd/archcheck, cmd/docsync, cmd/pkgcov, cmd/apilifecheck, cmd/releasecheck, cmd/deploymatrix, cmd/ledgercheck, cmd/seamcheck, cmd/hygiene, cmd/raceprobe, cmd/storagecheck, docs]
  # ── 受管外部包面（policy 级）──
  #
  # 第一方矩阵（oagentkit / oekit）整体纳入依赖方向的判定面。
  #
  # 为什么必须管：上游把能力搬家的频率不低——2026-10-20 这一轮就搬了两处
  # （toolgate/invoke → guardx/invoke、obs/obsx → llm/obsx）。而本仓的依赖
  # 方向表此前**只管内部包**（本仓包与包之间），管不到「本仓用了哪个上游矩阵
  # 模块」——于是那次搬家在本仓的门禁眼里**什么都没发生**：import 路径变了、
  # 依赖面变了（判定环从 eino 重仓挪到零依赖底座），但没有任何一处声明跟着改。
  #
  # 声明面分两层（与内部模块同构）：
  #   - 受管面（这里）：第一方矩阵整体
  #   - 逐模块的边（modules 段的 requires）：本包实际用了哪个上游矩阵模块
  #
  # 粒度选**矩阵模块**级（如 ext:github.com/oagentkit/guardx）而不是包级：
  # 包级会把 requires 撑成 import 清单（每换一个包名就是一次声明变更），
  # 模块级则正好表达「本包依赖矩阵的哪一块」。
  #
  # 第三方依赖（goja / eino / jsonschema 等）**不在**受管面内——它们由
  # forbid_import_regex 那几条规则管（禁宿主、禁宿主运行时），不需要逐包声明。
  ext_prefixes:
    - github.com/oagentkit
    - github.com/oekit

# ── 执行沙箱后端的档位登记 ──
#
# 「模型写的程序在哪跑、跑起来能触达什么」此前只有一个答案：进程内 goja VM（ptc），
# 而那个答案是**写死在调用点**的——没有档位概念，也没有「这次执行至少要多强」的
# 表达。于是宿主想跑一段不可信程序时，「它跑在够强的隔离里吗」这件事无处声明，
# 只能靠人记得别挑错后端。
#
# sandbox 包把它变成机制（Level 档位 + Provider 协议 + Registry），但**机制不等于
# 信任**：档位是后端自报的，后端若标了比实际更强的档位，宿主据此做的风险判断全部
# 落空，而构建全绿、测试全绿、日志里只有一条普通的进程记录。
#
# 这一段就是档位声明的**签字处**：每个后端一条登记（标识、档位、所在包），
# 「它凭什么说自己有这一档」写在该条的 notes 里——那是人 review 时会看到的地方。
#
# 执行体见 archcheck/sandbox.go（go/ast 判定），核对两件事：
#   1. 登记 ↔ 代码事实一致（档位漂移 = 代码改了登记没改）；
#   2. 实现 ↔ 登记齐全（未登记的后端，其档位声明不在被复核的清单里）。
#
# ⚠️ 这条门禁**判不了**「后端实际提供的隔离强度是否兑现其声明」——那要审实现。
# 它保证的是：声明可见（在 policy 里）、不漂移（门禁核对）、有签字（人 review）。
#
# level 填 sandbox 包的档位**常量名**（LevelNone/LevelProcess/LevelOS/LevelMachine）
# 而不是档位值（process/os/machine）：门禁不能 import 被判的包（它必须是最底层，
# 否则「用它判别人」就变成「它自己也在被判定」），故它只能比对代码里可静态识别的
# 那一面——常量名。两侧共用同一份真相，不另造映射表。
# ── 租户过滤漏拼门（tenant_gate 段，issue #172）──
#
# 形状归 policy，执行体是通用 AST 分析（archcheck/tenantgate.go）。本仓自身
# 的租户机制面只在 tenant 包：授权上下文类型 tenant.Context、租户域字段名
# Tenant、过滤列 tenant_id。宿主仓复用同一执行体时，把这一段换成自己的形状
# （如 Viewer / 自身模型字段 / team_id）——宿主字面不得进内核代码。
#
# 六条判据（issue #177 补齐到 6，与 bianque tenantcheck 同口径；1-3 见
# archcheck/tenantgate.go，4-6 见 archcheck/tenantmanifest.go）：
#   1. tenant-surface-missing-evidence：带授权上下文形参 + 返回租户域类型的
#      函数必须有隔离判定证据（调用登记的共享判定面 / Where|Raw 含过滤列 /
#      显式 `// tenant:iso <理由>`）；三者皆无 = 红。
#   2. viewer-dropped：带授权上下文形参却完全不用 = 红。
#   3. shared-surface-missing：登记在册的共享判定面在代码里不存在 = 清单漂移
#      = 红（一条被静默放宽的登记等于没有登记）。
#   4. tenant-policy-missing：含租户字段的模型映射出的物理表不在
#      tenant_tables_manifest 里 = 红（漏登记 = 隔离策略不覆盖这张表）。
#   5. tenant-policy-drift：清单登记的表在模型面已不存在 = 红（登记漂移 =
#      空登记）。4/5 是双向核对——清单与模型面谁走了谁都不行。
#   6. tenant-table-name-missing：含租户字段的模型没有可从 AST 识别的表名
#      方法（缺省 TableName，table_name_method 可改）= 红——解析不出物理
#      表名，登记面核对不了。
# 4-6 只在声明 tenant_tables_manifest 后启用。宿主持有的 RLS 注册表是 Go
# 符号，执行体调不到；清单是宿主自己 dump 的产物（或由一条校验测试保证与
# 注册表一致）。本仓无模型层（租户机制面只有判据，没有表），故不声明清单。
#
# 租户域类型清单**不另立**：tenant_type_roots（缺省 = roots）下任何含
# tenant_fields 字段名的 struct 都由代码推导，新增模型自动入面。
# ⚠️ 读面与登记面的推导根可分开：读面租户域类型可含服务层载体（输入/行 DTO
# 带租户字段但不映射物理表），登记面只认映射表的模型——载体多的宿主用
# tenant_table_type_roots 收窄登记面（缺省 = tenant_type_roots，不声明 = 旧口径）。
#
# 边界：本门禁判静态证据存在性，判不了「过滤是否真的生效」（调了判定面但没用
# 返回值、过滤条件被注释掉）；清单与宿主 RLS 注册表的一致性靠宿主自己的
# dump/校验测试保证。语义正确性归宿主运行期判据（tenant 包的
# Require/Can/Quota 是运行时对偶）。
tenant_gate:
  enabled: true
  severity: error
  desc: 服务层「授权上下文形参 + 租户域返回」必须有隔离判定证据；登记在册的共享判定面必须真实存在（清单漂移即红）
  roots: [tenant]                 # 服务层读面扫描面
  tenant_type_roots: [tenant]     # 租户域类型推导面（缺省=roots）
  auth_context_types: [tenant.Context]
  tenant_fields: [Tenant]
  filter_columns: [tenant_id]
  shared_surfaces:
    - dir: tenant
      name: Require
      note: fail-closed 租户上下文要求入口（未注入即拒绝）
    - dir: tenant
      name: Enforce
      note: 配额判定入口（上下文未注入即拒绝，判定与存储分离）

sandbox_providers:
  enabled: true
  severity: error
  desc: 执行沙箱后端的隔离档位必须登记在 sandbox_providers 段，且与代码事实一致（档位声明要有人签字）
  # 逐包列举，理由同 dependency_direction（issue #35）：前缀豁免会**无声地**把
  # 将来新增的 cmd 子包一起盖住。这些是工具，它们不实现 sandbox.Provider
  # （cmd/apilifecheck 为 issue #113/#104 的生命周期门禁，2026-11-12 登记同批）。
  ignore_dirs: [cmd/archcheck, cmd/docsync, cmd/pkgcov, cmd/apilifecheck, cmd/seamcheck, cmd/storagecheck, docs]
  providers:
    - id: gatecheck-managed
      level: LevelProcess
      package: gatecheck
      # 预算支持面：受管后端是**包装层**——它委派给内层后端执行，
      # 故预算支持面**就是内层后端的**。这里声明基本三闸（与 ptc-goja 同款），
      # 真实能力以内层后端自己的登记为准。
      supports: [wall_clock, max_calls, max_bytes]
      notes: |
        联合判据的受管后端：把审批层与沙箱层合成一条判定，判定不通过就**不委派**
        （副作用不会发生）——判据与执行不可分，否则「判过的后端 ≠ 实际跑的后端」
        就又有了信号落差。

        它对外声明的档位是**保证的隔离强度下限**（LevelProcess），不是内层后端的
        实际档位：档位登记门禁要求 ID()/Level() 是**可静态识别的常量**
        （「档位声明要有人签字」——运行期才知道的值无从签字），
        而实际跑哪个档位的内层后端由 Check 在运行期用登记簿判。

    - id: ptc-goja
      level: LevelProcess
      package: ptc
      # 预算支持面：只兑现基本三闸，**不兑现内存**。
      #
      # 为什么如实写「不兑现」：进程内 goja VM 跑在宿主进程里，而 Go 运行时没有
      # 「只给一个 VM 限内存」的开关，goja 公开 API 也没有内存限制（只有
      # SetMaxCallStackSize，那是栈深）。故它**真兜不住**内存——一个快速分配的
      # 程序能在 deadline 到点之前把宿主进程撑爆，而宿主里还跑着编排引擎。
      #
      # 上游 Capable 的缺省语义是「不实现即只兑现三闸」，本包如实落在缺省那一侧：
      # 宿主若要求 MaxMemory，登记簿**不会选中本后端**（要求与实际之间不允许有
      # 静默落差）。真要兜住内存只能把执行搬出宿主进程——设计见
      # docs/SANDBOX-DESIGN-20261021.md。
      supports: [wall_clock, max_calls, max_bytes]
      notes: |
        进程内 goja 解释器：能力面靠 JS 子集 + 绑定白名单裁剪，资源面靠三重预算。
        这层约束由**解释器自己执行**，不是内核强制——故档位是 LevelProcess 而非
        LevelOS。标成 LevelOS 就是让档位表说谎，而档位表是宿主做风险判断的依据，
        说谎的成本落在宿主身上。

    - id: ptc-subprocess
      level: LevelProcess
      package: ptc
      # 预算支持面：**兑现内存**（子进程 + 内核地址空间上限 RLIMIT_AS）。
      #
      # 与 ptc-goja 的差别就在这一维：能力面两者同级（都是 JS 子集 + 绑定白名单），
      # 强的只是**资源面**——执行搬出了宿主进程，内存由内核封顶。
      #
      # 进程内形态兜不住内存（Go 运行时没有「只给一个 VM 限内存」的开关，goja
      # 公开 API 也没有内存限制），故它**不实现** Capable，缺省即「只兑现三闸」。
      # 两个后端由此在登记簿里可区分：要求 MaxMemory 时，进程内后端**不被选中**
      # （要求与实际之间不允许有静默落差），子进程后端被选中。
      supports: [wall_clock, max_calls, max_bytes, max_memory]
      notes: |
        子进程执行后端：程序在子进程里跑，用内核地址空间上限兑现 MaxMemory。
        程序被内核杀掉时，父侧从管道 EOF 认出「执行域异常终止」——不是「程序返回空」。
        跨进程调用协议归上游 guardx/sandbox/wire（帧格式 + 两条通道 × 四个角色）；
        判定环与宿主工具留在父侧，故子进程形态**不弱化门禁**。
        宿主接入成本一行：main 开头调 ptc.MaybeRunChild()。

# ── 执行路径门禁（execution_paths 段）──
#
# 执行必须经 sandbox 登记簿：绕开登记簿直接调裸执行入口，档位下限、
# 预算可兑现性与审批门三层会**同时**失效——而这三条正是宿主据以做风险判断的依据。
# 声明还在，强制没了，门禁全绿。
execution_paths:
  enabled: true
  severity: error
  desc: 执行必须经 sandbox 登记簿（sandbox.Execute），不得直接调用裸执行入口
  # ✅ 本段**不豁免 cmd**（issue #35）：门禁工具与文档工具自己不执行任何第三方
  # 程序，本来就不需要这条豁免——而 cmd/ptcchild 恰恰是「会真实起子进程、并让
  # 父侧验证『不回结果时必须限期收场』」的程序，是这条判定面最该看一眼的对象。
  # 它现在被判定面覆盖着（它调的是 ptc.MaybeRunChild，不是裸入口 ptc.Run，故合规）。
  #
  # 判定面覆盖它是**有意义的信号**：哪天有人把它改成直接调 ptc.Run，这条门禁会红。
  # 按目录豁免的写法下，那种改动从来不会经过任何判定面。
  ignore_dirs: [docs]
  # 本仓自己的裸执行入口登记在**判据执行体的内置表**里
  # （archcheck/execution.go 的 builtinRawEntries）——那是本仓的 API 事实，
  # 让每个仓各登记一份就是**两份真相**（宿主改了登记、本仓没改，两边各判一套，
  # 漂移到没人发现为止，且没有任何信号：门禁都绿）。
  #
  # 这里只登记**别的仓**的裸入口（宿主自己的）。本仓没有——本仓的裸入口只有
  # ptc.Run 一条，且它只在本仓的 ptc 包内部被调用（无限定符 ⇒ 不是绕过）。
  raw_entries: []

# ── 子进程出口 ──
#
# 每个 **os/exec 启动点**都必须在这里登记它的出口档位。这是 P0-2 的后半：
# egress 给了词表与判据（env 生成 / Verify / 后端能力问询），但词表不会自己跑到
# 子进程上——子进程起来之后，它的出站流量完全在本进程 netguard 之外，
# 「声明了受限出口」在那一侧**没有任何东西兑现**，而报告全绿，因为没有判据在问
# 「这个 spawn 点在强制面内吗」。
#
# 判据五条（执行体见 archcheck/egresspaths.go）：
#   1. **未登记的启动点即红**——方向是 fail-closed：「没登记」不等于「不要求出口」，
#      而是「没人声明过它的出口是什么」。放成宽松侧的话，加一个 spawn 点就是一次
#      静默扩大判定面：未登记的启动点越多，判定面越小。
#   2. **mode: proxy 的必须在启动函数里看得见兑现的两半**：① env 的生成/校验
#      （Env / Verify 调用）② **后端能力的问询**（SatisfiedBy 调用）。
#      只看得见 ① 时，「声明了但没人执行」这一态拦不住——环境变量只是**建议**，
#      一个能改 env 却没有任何强制面的后端照样让流量自由出网，而「env 生成了、
#      挂上了」在报告里看起来就是「已兑现」。② 问的正是那一半：你**能强制**
#      这一档吗，问不到即不起子进程。两半分开报错（unplumbed / unprobed），
#      因为修法完全不同（加 Env vs 加后端）。
#   3. **mode: denied 直接红**——环境变量拦不住静态二进制、UDP 与原始 socket，
#      写在登记里等于把「假装禁网」写进 policy。禁网只能由带能力声明的后端强制。
#   4. **陈旧登记即红**——文件/函数不存在，或那个函数里没有启动调用。
#      声明与事实偏离而无人红，是无声漂移（与「陈旧包根当天即红」同一把尺子）。
#   5. **不得把全量环境交给子进程**（os.Environ() / procx.InheritAllExcept 即红，
#      **不看登记档位**）。后者是 runtime v0.10.0 新增的「全量继承 + 剔除若干」入口，
#      给「SDK 包装用户自己的 CLI」那种可信父进程场景用——本仓的子进程跑的是模型写的
#      程序，用在这里等于把侧门重新开回来；而它名字里没有 Environ，只认 os.Environ 的
#      判据对它**静默放行**。上游多一个函数 ≠ 本仓多一条合法路径。
#      这条与 1~4 正交：登记段回答「出站策略是什么」，本条回答「子进程能看见宿主的
#      哪些秘密」。登记成 unrestricted 的启动点同样不该继承整份环境——子进程是模型
#      写的程序，它的隔离面是 JS 子集而非 OS 沙盘，整份环境里有 provider 的 API key、
#      对象存储令牌、数据库口令，程序没有网络也没有 exec，但它能读到秘密再写进返回值。
#      **判定粒度是文件**（不是启动函数）：环境 base 常由辅助函数生成（childBaseEnv /
#      buildEnv 这类），含 spawn 的函数里只剩一句调用——实测把 os.Environ() 放进辅助
#      函数，函数级判据一条都不报、退出码 0。代价是「文件里另有无关的 os.Environ()」
#      会假红，这一方向是刻意选的：红可见可讨论（走 exceptions 登记原因与拆除条件），
#      绿不可见。
#
# 判定面覆盖的形态（收集器在 archcheck/spawnsites.go）：限定符调用（**别名**同样命中，
#      按 import 路径解析不按名字猜）、**点导入**（`import . "os/exec"`，调用没有限定符）、
#      **包级初始化**（`var cmd = exec.Command(...)`，不在任何函数里）。入口表按 import 路径归，
#      除 os/exec 还含 os.StartProcess 与 syscall.Exec/ForkExec/StartProcess——它们同样绕开
#      出口强制面，也各自接受 Env。这三类形态都是 2026-11-06 注入实测出的漏判：换一种写法
#      就能让门禁一声不响地全绿，而「换写法」不是恶意的，是重构的自然产物。
egress_paths:
  enabled: true
  severity: error
  desc: 每个子进程启动点都必须登记出口档位；要求经代理的必须在 spawn 之前既看得见 env 的生成/校验、也看得见后端能力的问询（只生成 env 证明不了它被执行面强制）；且不得把全量环境（os.Environ）交给子进程
  entries:
    - path: ptc/childpipes.go
      fn: newChildPipes
      mode: proxy
      notes: |
        ptc 子进程后端的唯一 spawn 点（re-exec 宿主自己的可执行文件）。兑现的两半都在
        newChildPipes 里：Spec.SatisfiedBy(opts.EgressBackend) 先问「这个后端能强制这一
        档吗」（问不到即不起子进程），再由 Spec.Env 把它落成子进程变量。登记成 proxy 是
        **结构性事实而非本仓的策略选择**：本仓给这一层能施加影响的唯一时点就是 spawn
        之前，故这里保证的是「只要宿主声明了代理，env 一定按声明生成，生成不出就不起
        子进程」——SubprocessOptions.Egress 的零值（不限制）逐字返回原 env，旧调用点行为
        不变。真正的强制（代理本体、deny 列表）归上游与宿主：本仓不造第二套网络栈。
    - path: cmd/ledgercheck/issuestate.go
      fn: fetchIssueStates
      mode: unrestricted
      notes: |
        台账门禁判据 5（issue #455）的 issue 状态拉取点：起 `gh issue list --state all
        --json number,state` 子进程，把「台账说已合入」与「GitHub 上还开着」这类
        **两个系统之间**的漂移判出来（#427/#428/#430 就是这么关漏的）。
        登记成 unrestricted 是**事实**而不是放行：gh 自己持 token 出站，本进程是
        门禁工具、不跑 netguard，给不出「被代理强制」的证据——登记成 proxy 只会让
        门禁以为「这条路径的出口有人管过」（与 cmd/releasecheck 的 gitOut 同款口径）。
        子进程环境走唯一事实源 procx.ChildEnv（PATH/HOME 等基础白名单 + 按名放行
        GH_TOKEN / GITHUB_TOKEN），**不继承全量 environ**：本工具在 CI 里跑，父进程
        环境可能带凭据。
        将来若有人把这个拉取改成**写**操作（关单 / 改标题），本条目必须同步审视——
        门禁只判「有没有登记」，不判你拿它干了什么。
    - path: cmd/releasecheck/main.go
      fn: gitOut
      mode: unrestricted
      notes: |
        发版纪律门禁的 git 读取点：只跑 describe / log / cat-file 三类**本地**子命令
        （不接触远端；命令串写死在本文件里，不含外部输入）。登记成 unrestricted 是
        **事实**而不是放行——这些子命令没有网络面，给不出「被代理强制」的证据，登记成
        proxy 只会让门禁以为「这条路径的出口有人管过」。
        子进程环境走唯一事实源 procx.ChildEnv（PATH/HOME 等基础白名单 +
        GIT_TERMINAL_PROMPT=0），**不继承全量 environ**：本工具在 CI 里跑，父进程
        环境可能带凭据，而 git 的本地子命令用不到它们。
        将来若有人在这里加 fetch / push，本条目必须同步改成 proxy 并补上兑现的两半
        （env 生成 + 后端能力问询），否则门禁会在那个提交上直接红。
    - path: cmd/hygiene/main.go
      fn: gitOut
      mode: unrestricted
      notes: |
        仓库卫生门禁的 git 读取点：只跑 rev-parse / ls-files 两个**本地**子命令
        （不接触远端；命令串写死在本文件里，不含外部输入）。登记成 unrestricted 是
        **事实**而不是放行——这两个子命令没有网络面，给不出「被代理强制」的证据，
        登记成 proxy 只会让门禁以为「这条路径的出口有人管过」。
        子进程环境走唯一事实源 procx.ChildEnv（PATH/HOME 等基础白名单 +
        GIT_TERMINAL_PROMPT=0），**不继承全量 environ**：本工具在 CI 里跑，
        父进程环境可能带凭据，而 git 的本地子命令用不到它们。
        将来若有人在这里加 fetch / push，本条目必须同步改成 proxy 并补上兑现的两半。
    - path: cmd/raceprobe/exec.go
      fn: defaultSpawner
      mode: unrestricted
      notes: |
        race 门禁看门狗的子进程启动点：起 **go test**（跑本仓自己的用例）。
        登记成 unrestricted 是**事实**而不是放行——这条路径的网络面由 Go 工具链
        自己管（模块下载走 GOPROXY），本仓既没有能施加影响的执行后端，也没有可问
        的 egress.Spec；登记成 proxy 只会让门禁以为「这条路径的出口有人管过」，
        而实际没有任何东西在管。
        子进程环境走唯一事实源 procx.ChildEnv（PATH/HOME 等基础白名单），
        **不继承全量 environ**：本工具在 CI 里跑，父进程环境可能带凭据，而
        go test 用不到它们。字面注入的只有 CGO_ENABLED=1（race 必须开 cgo），
        其余是 Go 工具链变量的按名透传（口径见 exec.go 的 childEnv 注释）。
        将来若有人在这里换成会联网的子命令，本条目必须同步改档位。

# ── 宿主接缝契约门禁（issue #369/#370）──
#
# 三种机判形态与取舍见 archcheck/seams.go 的文件头（形态 B 阻断 / 形态 A 只读 /
# 形态 C 阻断）。这里的段只是**声明面**；枚举面由 AST 规则自己给出（导出函数/
# 方法/接口方法/结构体字段中参数或字段类型为 func() time.Time 的声明）。
seams:
  enabled: true
  severity: error
  marker: "@seam:"
  # 三条约束的固定模板（#369）：不得重入 / 不得阻塞 / panic 处置。
  required: [no-reentry, no-blocking]
  # panic 处置二选一：
  #   panic-isolated = 内核 recover 并上报；
  #   panic-caller   = 内核不 recover，由调用方兜（显式第三态，不许不写）。
  panic_dispositions: [panic-isolated, panic-caller]
  # 判定面自检：枚举逻辑若漂移到 0 个声明，门禁必须响亮失败而不是静默变绿。
  min_declarations: 1
  lock_scan:
    enabled: true
    severity: warn   # 形态 A 是一阶启发式，漏判形态见 seams.go——只读、不阻断
    accessors: [now, nowLocked, nowAt, clock]
  panic_scan:
    enabled: true
    severity: error
    # 已登记的高危宿主调用：调用点必须位于隔离包装器回调内，或所在函数带
    # defer recover。清单是增量的（#368 的批量续期是第一条）；未登记的接缝
    # 由上面的契约标记完备性兜底（#400 的机判清单是后续工作）。
    guarded_calls: [RenewBatch]
    wrappers: [async.GoSafe, async.RunSafe,
               async.GoSafeWithErr, async.GoSafeWithContext]

# ── 判定词表登记面（issue #356 / #363 的共同根因）──
#
# 词表是**决定结论**的取值集合。此前内核侧补齐了导出枚举出口（#356），
# 但**消费侧**仍各写一份字面量：内核新增一个取值，消费方那份不会跟着变，
# 且没有任何判据会红——同一个状态在两处得到相反结论。
#
# 这一段把「消费方必须**引用**而不是手抄」变成机器判据：
#   - 取值属登记词表 ⇒ 出现它的那个包须**自有常量**（自己命名这个概念）
#     或**引用主人常量**（owner.Const）；两者都没有 ⇒ 手抄 ⇒ 红；
#   - 登记与事实偏离（包改名 / 表改名 / 枚举出口读的是另一张表）当天即红。
#
# 登记面只写「哪张表、在哪个包、枚举出口叫什么」——**不写取值清单**：
# 取值由代码派生（表的键 → 常量声明 → 常量取值），policy 里抄一份就是
# 第二份会漂移的真相，而它漂移的方向恰好是「门禁判的和代码跑的不是一套词表」。
word_tables:
  enabled: true
  severity: error
  desc: 判定词表的取值必须被引用，别的包不得手抄
  # ignore_dirs：不参与手抄判定的目录（含子目录）。本仓**不用**这个口子——
  # 它是给宿主的（如 vendored 示例），且每个条目都必须在 policy 里写明理由：
  # 豁免若没有理由，就等于让那棵子树重新变成「没人管的真相」。
  # ignore_dirs: []
  tables:
    # 会话轴 + 环节轴共 13 个状态取值（主人是 contract）。
    - pkg: contract
      backing: statusClass
      enum: AllStatuses
      # 判定面（IsKnownStatus / ClassifyStatus 都读 statusClass）：
      # 声明了就得守住——判定面若另抄一份清单，判定与词表会分叉。
      predicate: IsKnownStatus
      # 族前缀：主人包里以 Status 开头的字符串常量都属于这张表。
      # 声明了它，反向派生才成立——「常量加了、表没加」当天即红
      # （否则那个新取值的消费侧从此没人管）。
      family: Status
      desc: 会话/环节状态词表（13 值）
    # 环节轴 12 值：statemachine 的常量是 contract 的**别名**
    # （StatusCreated = contract.StatusCreated），取值解析必须能跨包追——
    # 这正是本段执行体的难点，也是「派生不出取值」必须报红的原因：
    # 派生不出若被当成「没有手抄」，门禁就是静默空转。
    - pkg: statemachine
      backing: stepStatusAll
      enum: AllStepStatuses
      predicate: StepStatus.Valid
      family: Status
      desc: 环节状态词表（12 值）
    - pkg: statemachine
      backing: stepTypeAll
      enum: AllStepTypes
      predicate: StepType.Valid
      family: Type
      desc: 环节类别词表（5 值）
    - pkg: taskboard
      backing: taskStateAll
      enum: AllStates
      predicate: State.Valid
      family: State
      desc: 任务状态词表（4 值）
    # ── protocol 的五张判定词表（第十一轮实测后登记）──
    #
    # 登记前**逐张实测**过手抄命中量（单表注册 → 跑真门禁 → 数命中）：
    # 这五张的命中量都是 0 ⇒ 登记它们不会给仓库带来噪声，
    # 而它们此前处于「有枚举出口却没人管」的状态。
    #
    # 同批实测里另 7 张表命中 1~28 处，**全是跨概念同形**（日志级别
    # "info"、门禁严重度 "error"、通用词 "unknown"）⇒ 不登记，
    # 理由逐条写在下面的 not_registered 段。
    - pkg: protocol
      backing: stanceAll
      enum: AllStances
      predicate: IsStanceValid
      family: Verdict
      desc: 报告立场词表（3 值：adopt/dispute/reject）
    - pkg: protocol
      backing: confidenceAll
      enum: AllConfidences
      predicate: IsConfidenceValid
      family: Confidence
      desc: 置信档位词表（3 值：high/medium/low）
    - pkg: protocol
      backing: decisionAll
      enum: AllDecisions
      predicate: IsDecisionValid
      family: Decision
      desc: 决策词表（3 值：pending_approval/approved/rejected）
    - pkg: protocol
      backing: scopeAll
      enum: AllScopes
      predicate: IsScopeValid
      family: Scope
      desc: 范围词表（2 值：in/out）
    - pkg: protocol
      backing: confidenceKinds
      enum: AllConfidenceKinds
      predicate: IsConfidenceKindValid
      family: ConfidenceKind
      desc: 置信语义种类词表（4 值）
    # protocol 的图表状态**输入归一词表**：词形是外部喂进来的（healthy / down /
    # 正常 / 宕机……），消费方自由使用——那是输入数据，不是判定依据。
    # 判它的是「这张表有导出枚举出口，且出口读的是同一张表」：
    # 归一表归 protocol 管这件事不许漂（漂了＝归一判定与出口各说各话）。
    # 写成 kind: input 而不是 decision，是实测出来的：按 decision 登记会命中
    # 17 处，大半是 JSON 键、HTTP 体这类无关上下文（判据成了拼写匹配器）。
    # normalizer：输入归一词表**必须有归一出口**——没有它，消费方只能自己
    # 判这个词形，同一输入词在不同消费方得到不同结论。
    # 判据要求它**导出**（宿主要用；未导出等于没有出口）且读同一张表。
    - pkg: protocol
      kind: input
      backing: chartStatusGroups
      enum: AllChartStatusWords
      normalizer: ChartStatus
      desc: 图表状态归一输入词表（分组形状；判出口、归一出口与表同源）
    # controlplane 的介入动作词表：**常量切片**形状（[]Action{...}）。
    #
    # 此前它登记不进来（第十一轮的实测结论写在本文件末尾的 not_registered 段）：
    # 当时的执行体把「切片」一律当成分组表。第十一阶段实测发现切片有两种形状——
    # 元素是**常量名**（扁平表，取值可派生）/ 元素是**复合字面量**（分组表，
    # 取值在组内）——形状不决定判不判，只决定**能不能派生取值**。
    - pkg: controlplane
      backing: interventionActions
      enum: AllInterventionActions
      predicate: IsKnownInterventionAction
      family: Action
      desc: 介入动作词表（3 值：force_release/adjudicate/terminate）
    # 回合结局：模型侧**一次往返**的结局分类（第三根轴——既不是会话状态，
    # 也不是环节状态）。判定面（Reason.Valid）与枚举出口（AllRoundReasons）
    # 读同一张表；失败型收敛与温和叫停由 Reason.IsFailure 分开判。
    - pkg: roundguard
      backing: roundReasonAll
      enum: AllRoundReasons
      predicate: Reason.Valid
      family: Reason
      desc: 回合结局词表（10 值）
    # 额度类别：额度用尽在哪一维上（回合数 / 工具调用总数 / 单工具 / 无进展）。
    # 与 roundReasonAll 同形但**不同概念**：Reason 判「这一回合以什么结束」，
    # Limit 判「哪一维额度被用尽」——同一串字面量在两处含义不同，故 relations
    # 段按 distinct 显式登记。
    - pkg: roundguard
      backing: roundLimitAll
      enum: AllLimits
      predicate: Limit.Valid
      family: Limit
      desc: 额度类别词表（5 值）
    # 处置口径：额度用尽之后怎么办（强制收尾 / 直接失败）。**策略**而非事实——
    # 各家没有共识，故单列一张表，且口径**不按额度维度分别配置**（一个口径管
    # 全部额度 ⇒ 跨宿主口径一致）。
    - pkg: roundguard
      backing: stopPolicyAll
      enum: AllStopPolicies
      predicate: StopPolicy.Valid
      family: Policy
      desc: 额度用尽后的处置口径词表（2 值）
    # 无进展形态：模型侧循环的五种形态（重复 / 震荡 / 漂移 / 错误螺旋 / 空转）
    # 加「未命中」。判定面（Shape.Valid）与枚举出口（AllShapes）读同一张表。
    # 与 roundReasonAll / roundLimitAll 同形但**概念不同**：Shape 答「这一段
    # 循环有没有在原地打转」，不答「这一回合以什么结束」也不答「哪一维额度用尽」
    # ⇒ relations 段按 distinct 显式登记（下面那条 AllLimits ↔ AllShapes）。
    - pkg: roundguard
      backing: roundShapeAll
      enum: AllShapes
      predicate: Shape.Valid
      family: Shape
      desc: 无进展形态词表（6 值）
  # relations：**同形取值的两张表之间的关系**声明（中心清单）。
  #
  # 为什么需要它：同一个拼写可能是**多张判定词表**的取值，而它们的**含义**
  # 可能相同也可能不同（contract 的 "failed" 是会话失败、taskboard 的 "failed"
  # 是任务失败——后者还允许重新认领，根本不是终态）。
  #
  # 手抄判据只按「值在不在表里」判 ⇒ 它分不出「这处字面量想说的是哪张表」
  # ⇒ 修法文案若只指向某一张表，就可能把人引到**错误的概念**上
  #（把任务失败改成引用会话失败常量 = 语义损坏）。
  #
  # ⇒ 凡两张登记的**判定词表**有同形取值，必须在这里显式声明关系：
  #   - same     ：同一概念（一张表的别名/子集），引用任一家都对；
  #   - distinct ：不同概念（同形只是拼写巧合），手抄方必须**在本包命名**。
  #
  # 表身份用 **pkg + enum**（枚举出口是每张表唯一的对外身份——protocol 一个包
  # 里就有五张表，包名不足以区分它们）。关系是**对称**的，写反了等价。
  #
  # 下面这五对是**实测**出来的（撞车判据跑真门禁报出来的），不是估的。
  #
  # 每条关系都带 **anchors**：把关系锚到**具体常量**上。
  #
  # 为什么：关系本身是**人写的事实**（「会话失败 ≠ 任务失败」是人判的）。
  # 主人包若改了某个取值的**含义**（不是拼写），关系不会跟着变 ⇒ 一条
  # **说谎**的关系会安静地留着。锚点让四条原本没人判的事实当天即红：
  #   ① 锚点常量**改名或被删**（声明指向了不存在的东西 = 登记漂移）；
  #   ② 锚点常量的取值**不再属于它那张表**（锚点说的是别的表的词）；
  #   ③ 两端锚定的**取值不成对**（关系的前提「同形」不成立）；
  #   ④ distinct 关系的两端锚点**解析到同一处声明**（同一处声明不可能是
  #      两个概念 ⇒ 「不同概念」是说谎的，指路会要求本包另起名字）。
  #
  # 锚点**按取值成对**：a 侧锚定的每个取值，b 侧必须有同名值的锚点。
  # 锚点是**可选的加固**——键是字面量、根本没有常量可锚的表不写锚点；
  # 但**半边锚点没有配对语义** ⇒ 要写就两端都写（自校验当天即红）。
  relations:
    # statemachine 的环节状态常量是 contract 会话状态的**别名**
    # （StatusCreated = contract.StatusCreated）⇒ 同一概念，引用任一家都对。
    # 锚点两端解析到**同一处声明** ⇒「同一概念」是机器证过的事实。
    - a: {pkg: contract, enum: AllStatuses}
      b: {pkg: statemachine, enum: AllStepStatuses}
      relation: same
      anchors:
        a: [{all: true}]
        b: [{all: true}]
    # 会话失败 ≠ 任务失败（taskboard 的 failed 允许重新认领，非终态）。
    - a: {pkg: contract, enum: AllStatuses}
      b: {pkg: taskboard, enum: AllStates}
      relation: distinct
      anchors:
        a: [{all: true}]
        b: [{all: true}]
    # 会话状态「已批准」≠ 报告决策「已批准」：一个是生命周期，一个是判定结论。
    - a: {pkg: contract, enum: AllStatuses}
      b: {pkg: protocol, enum: AllDecisions}
      relation: distinct
      anchors:
        a: [{all: true}]
        b: [{all: true}]
    # 同上（statemachine 的环节状态与 contract 同族，故与 taskboard / protocol
    # 也都是不同概念）。
    - a: {pkg: statemachine, enum: AllStepStatuses}
      b: {pkg: taskboard, enum: AllStates}
      relation: distinct
      anchors:
        a: [{all: true}]
        b: [{all: true}]
    - a: {pkg: statemachine, enum: AllStepStatuses}
      b: {pkg: protocol, enum: AllDecisions}
      relation: distinct
      anchors:
        a: [{all: true}]
        b: [{all: true}]
    # 会话失败 ≠ 回合失败：一个是会话终态，一个是某一回合的结局。
    - a: {pkg: contract, enum: AllStatuses}
      b: {pkg: roundguard, enum: AllRoundReasons}
      relation: distinct
      anchors:
        a: [{all: true}]
        b: [{all: true}]
    # 同上（statemachine 的环节状态与 contract 同族）。
    - a: {pkg: statemachine, enum: AllStepStatuses}
      b: {pkg: roundguard, enum: AllRoundReasons}
      relation: distinct
      anchors:
        a: [{all: true}]
        b: [{all: true}]
    # 任务失败 ≠ 回合失败（taskboard 的 failed 允许重新认领，非终态）。
    - a: {pkg: taskboard, enum: AllStates}
      b: {pkg: roundguard, enum: AllRoundReasons}
      relation: distinct
      anchors:
        a: [{all: true}]
        b: [{all: true}]
    # 回合结局 ≠ 额度类别：同包两张表，**同形异义**。
    #   - "tool_calls"：回合结局里是「模型要工具」（控制流事实），
    #     额度类别里是「工具调用总额度用尽」（额度判定）；
    #   - "stalled"：回合结局里是「本回合无进展、温和叫停」（结局分类），
    #     额度类别里是「无进展这一维额度被命中」（额度判定）。
    # 前者答「这一回合以什么结束」，后者答「哪一维额度被用尽」⇒ 不同概念，
    # 手抄任一家都可能是语义损坏（引用别人的常量会把语义装错）。
    - a: {pkg: roundguard, enum: AllRoundReasons}
      b: {pkg: roundguard, enum: AllLimits}
      relation: distinct
      anchors:
        a: [{all: true}]
        b: [{all: true}]
    # 额度类别「none」≠ 形态类别「none」：一个是「未因额度叫停」，一个是
    # 「未命中任何形态」——同形只是拼写巧合，手抄方必须**在本包命名**
    # （引用别家的常量会把语义装错：额度判定 ≠ 形态判定）。
    - a: {pkg: roundguard, enum: AllLimits}
      b: {pkg: roundguard, enum: AllShapes}
      relation: distinct
      anchors:
        a: [{all: true}]
        b: [{all: true}]
  # not_registered：**有意不登记**的判定词表候选（与 exceptions 同款纪律）。
  #
  # 为什么要有这份清单：登记面是稀疏的，而稀疏本身没人记——「这张表我们
  # 决定不登记」若只留在某个人脑子里，下一个人会重新调研一遍，甚至直接
  # 把它登记进去。**不登记也要留痕**，且理由要写「为什么不登记」。
  #
  # 下面每条理由里的命中数都是**实测值**（单表注册 → 跑真门禁 → 数命中），
  # 不是估计：登记这些表会把**跨概念同形**的通用词拖进判据
  # （日志级别的 "info"、门禁严重度的 "error"、到处都有的 "unknown"），
  # 于是手抄判据退化成拼写匹配器——判红到没人信它，它就等于没有。
  not_registered:
    - subject: protocol.severityAll（严重度：info/low/medium/high/critical）
      reason: 实测登记后 5 处命中，全是跨概念同形（eventbus 的日志级别 "info"、budget 的 "critical"）——按值匹配的判据会把日志级别也拖进协议词表
    - subject: protocol.escalationReasons（升级原因：low_confidence/error/timeout/unavailable/unknown）
      reason: 实测登记后 28 处命中，全是通用词（"error"/"timeout"/"unknown" 在全仓随处可见）⇒ 判据会退化成拼写匹配器
    - subject: protocol.decisionSources（判定来源：rule/llm/classifier/clarify/fallback/manual/unknown）
      pkg: protocol
      prefixes: [DecisionSource]
      reason: 实测登记后 11 处命中，全部因 "unknown" 是通用词
    - subject: protocol.actionWhitelist（动作：kill_and_restart/tune/none）
      reason: 实测登记后 4 处命中，全部因 "none" 是通用词
    - subject: ptc.errorKindTable（PTC 错误种类 14 值）
      reason: 实测登记后 2 处命中（dispatch 的 "deadline"、protocol 的 "pending"）——两处都是**别的**错误分类口径，同形不同义
    - subject: delegate.AllStatuses（委派回执状态：completed/failed/refused）
      reason: 实测登记后 1 处命中（dispatch 的 "refused" 属另一套拒绝口径）；且 "failed"/"completed" 与 contract 的会话状态同形
    - subject: 门禁严重度词表（error/warn）
      reason: 与 HTTP 结果码、图表状态同形 ⇒ 要求命名会变成对**键名**也要求命名，噪声大于价值（第十轮结论）
    - subject: 协议字段名（JSON 响应里的 "error" 等键）
      reason: 它们不是取值是**键名**（判据的排除面已处理结构体标签与 import 路径）
    - subject: controlplane.ActionQuery（查询动作：不介入、不留痕）
      pkg: controlplane
      prefixes: [ActionQuery]
      reason: 查询动作不经留痕（它不是一次介入，不改变运行状态）⇒ 不属于介入动作词表。声明归属前缀后，介入词表不必再手写豁免段

# ── 全局阈值 ──
thresholds:
  max_file_lines: 400
  # 单类型方法数上限——god object 的机械判据。
  #
  # 为什么单独设一条：大文件不等于大对象。1026 行的装配函数与 1026 行的纯声明文件
  # 性质完全不同；而「一个类型挂了 N 个方法」是**可自动发现**的结构债——方法越多，
  # 任何一次改动要在多大的影响面上评估，全凭这个数。宿主仓实测出现单类型 175 个方法
  # 的实例，故此判据比行数更能提前报警。
  #
  # ⚠️ 本条比的是**实质方法数**，不是方法总数（见下方 forwarding_shell_max_chars）。
  max_methods_per_type: 25
  # 「转发壳」的方法体长度上限（字符）——god object 阈值**不计入**转发壳。
  #
  # 转发壳 = 方法体只有一条转发语句（一次调用 / 一次返回转发值）、且剥掉注释与空白后
  # 长度不超过此值。
  #
  # 为什么要有这一条（issue #13）：方法数超阈值的**前提**是「该类型同时承担了过多
  # 关注点」。这个前提对**退化成 façade 的类型**不成立——把实现下沉到子包、自己只做
  # 转发的 façade 承担了零关注点，它的方法数 ≈ **公共 API 表面规模**，是另一个量。
  # 把 API 表面规模判成复杂度集中，会逼维护者在「撤销一次正确的重构」与
  # 「调高阈值（等于放弃判据）」之间二选一——**两个都是坏选择**。
  # 这就是「假红」最坏的形态：报错把正确的工作判成错的，判据对最该被表扬的宿主
  # 最不友好。
  #
  # 刻度依据：宿主实测样本里，一个 45 方法的纯 façade 有 39 个方法体 ≤140 字符、
  # 只有 4 个超过 400 字符；而三个真 god object 对照组（47 / 46 / 42 方法）的
  # 转发壳占比是 **0%**——即 140 这个刻度能把「拆干净的 façade」与「真复杂」分开，
  # 且**不改变对照组的判定**。
  #
  # 显式写 0 = 关闭该区分（所有方法都算实质方法），判定逐字退回旧行为。
  # 不写 = 用缺省值 140。老 policy 不需要改即可享受修正。
  forwarding_shell_max_chars: 140
  # scan_roots 必须**覆盖 modules 段的全部 roots**——漏一个包，该包对上面两条
  # 阈值就完全隐形（可以长到任意行数、挂任意多方法而不报）。
  #
  # 2026-10-19 补齐：guardset 早已登记在 modules 段（依赖方向门禁管着它），
  # 却一直漏在 scan_roots 之外，于是「超长文件」「god object」两条阈值对它
  # 从来不生效——两条都只差一个字面量，谁也不会发现。
  # 现在由 archcheck 的 policy 自校验强制两者一致（漏一个即门禁红）。
  #
  # sqlite 条目 = 单机持久化那**一个**包（examples/sqliteadapter，issue #424）：
  # 2026-11-19 起，名为 sqlitestore 的 flock + JSONL 文件后端（**不是 SQLite**）
  # 已删除，它的 modules 条目与这里的 scan_root **同摘** ⇒ 下面只剩真 SQLite 这条。
  #
  # 耦合提醒（删包时必须同做）：modules 段与 scan_roots 段必须**同步**——
  # 只摘一边，policy 自校验当天即红（「登记在 modules 段却不在 thresholds.scan_roots
  # 段」/「thresholds.scan_roots 项 %q 不存在或无法读取」）。
  scan_roots: [protocol, statemachine, eventbus, spill, netguard, ptc, watchdog, delta, pending, drain, reconcile, contract, checkpoint, commitgate, budget, offload, tooldisclose, guardset, toolname, sideeffect, sidetest, retryplan, cmdpolicy, egress, preset, sessionref, taskboard, taskboard/boardtest, skilldisclose, hookengine, memorypipe, delegate, worktree, gatecheck, trajectory, ticket, archcheck, internal/ledgerstatus, cmd, examples/reference-runtime, backend, handoff, ownership, eval, examples/containerbackend, coord, worker, scheduling, examples/worker-runtime, cost, tenant, controlplane, metrics, finalize, steer, dispatch, deadline, roundguard]
  enforce: true
  # enforce=true 时超阈值即非零退出。切换条件（两条均已满足，2026-10-18 切换）：
  #   1) 现存超限项清零或显式登记为债；
  #      ——3 处超长文件已拆分归零：
  #        protocol/report_types.go    660 → report_types(329) + report_charts(341)
  #        protocol/report_test.go     782 → report_test(373) + report_charts_test(227)
  #                                       + report_tolerance_test(196)
  #        cmd/archcheck/main.go       490 → main(175) + policy(84) + scan(253)
  #        （2026-10-19 起执行体整体下沉为 archcheck/ 包，cmd/archcheck 只做装配）
  #   2) 接入 CI（本地 gate 会被习惯性绕过，CI 不会）——本门禁在 make check 里，
  #      而 make check 就是 CI 唯一执行物。
  # god object 判据（max_methods_per_type）当前零违规，随本条一并转为阻断。

exceptions:
  # 例外的对账纪律（issue #447）：每条例外要么**命中至少一条违反**，要么被**显式
  # 标记**为「已失效待删」——两者都不是 ⇒ 当天即红（僵尸例外），且报告逐条点名。
  #
  # 标记写法：在该条例外上加一行
  #     status: stale
  # 取值域**封闭**：只能省略（在用）或 stale；拼错（如 stal）当天自校验红——
  # 拼错的标记若被当成「在用」，命中 >0 时会绿，维护者写下的意图与结论相反。
  # 标了 stale 却**仍命中**违反也会红（矛盾即红）：否则 stale 就成了「写一次
  # 永久免检」的免死金牌。已到期例外不参与对账（到期线另有独立回显）。
  #
  # ── issue #440（harness-test-defer-cleanup）────────────────────────────
  # 本规则落地后，eventbus 侧的 6 处命中**已全部清偿**：3 处站点改成 defer
  # 形态（收尾 join 写进 defer，失败路径也 join）、3 处所在文件按关注点拆分
  # （issue #443 线）⇒ 相应例外已删除。
  # ⇒ **不留「命中不到任何东西」的僵尸例外**：例外一旦失效就静默放过，
  # 债便可以无限期豁免——那是本仓最贵的失效形态之一（另开单跟踪，
  # 见台账 §34「例外静默失效」那条边界）。
