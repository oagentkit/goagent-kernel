# 部署配方能力清单（issue #277）
#
# 这份文件回答一个问题：**「我现在这套组合，缺哪些能力才能上生产」**。
# 它是机器可查的声明面——`make deploycheck`（cmd/deploymatrix）逐条判定：
#
#   1. 每条能力的 evidence 可解析：
#      - contract: path#Symbol —— 文件存在且符号真的声明在文件里（go/ast）
#      - gate: target        —— Makefile 里有这个目标
#      - issue: #N           —— 单号在 docs/*.md 或 CHANGELOG 有落点（本地可查）
#      - doc: path           —— 文件存在
#   2. state 必须由证据推导（禁止手写一个会过期的结论）：
#      available = 至少一条 contract/gate 且无 issue 缺口
#      partial   = 既有 contract/gate 又有 issue 缺口
#      missing   = 只有 issue 缺口（还没有可查的契约/门禁落点）
#      其中「issue 缺口」= **该单号在台账里仍开着**（docs/DISTRIBUTED-EVOLUTION-*.md
#      是单号状态的唯一真相，由 internal/ledgerstatus 派生）：已合入的单不再是
#      缺口——把它算成缺口，能力就永远停在 partial，矩阵等于对宿主说「你还缺
#      这个」而它其实早有了。**缺口必须挂一个仍开着的单号**（有主的缺口），
#      已关闭的单只能进 delivered_by，不能再当缺口挂。
#   3. 场景 readiness = 必需能力里最差的那个状态；
#   4. docs/USAGE.md 的 deploy-matrix 块必须与本文件的场景口径逐行一致。
#
# **与存储选型声明面的粒度关系**（本文件 ↔ docs/STORAGE-SELECTION.yaml）：
#
#   - 本文件的 evidence 是**面级展开**：一条能力把它的各张脸**各列一条落点**
#     （single-store-full-state 就列了任务板 / 副作用 / 快照 / 事件四个面）；
#   - 选型声明面的 evidence 是**事务域本体**：一条能力只指那条把各张脸收进
#     **同一份事务域**的入口（examples/sqliteadapter/apply.go#Store.Apply）；
#   - 两边用的是**同一个 capability id**（能力词表的唯一真相是本文件），id
#     层面的一致性由 `make storagecheck` 判据 2 机判（场景的 storage 必须
#     提供该场景 required 的全部能力）⇒ **不要求 ref 集合逐条相同**。
#
#   ⇒ 「矩阵 4 条、选型面 1 条」**不是一份漏了三条**，是同一能力的两种粒度：
#     矩阵回答「这个能力由哪些面兑现」，选型面回答「这个引擎能不能兑现它」。
#
# **requires_multi_writer**（2026-11-20 声明面收紧，issue #424 的后续）：

#   每条能力必须**显式**标注 true（多写者能力）/ false（单写者能力）——
#   **缺省即红**（漏登记 = 该能力对判据无从下手 = 判据静默失效）。
#
#   ⚠ 这个字段**不由 deploycheck 判**（deploycheck 只**容忍**它）⇒ 由
#   `make storagecheck` 的写者数交叉校验判：
#
#     W1（存储侧）：存储的写者上限是多写者档位（≥2 或 unlimited）
#         ⟺ 它认领了至少一项多写者能力；
#     W2（场景侧）：场景形态的写者数 ≥2 ⟺ 该形态下至少一个场景的 required
#         含多写者能力；形态写者数 ==1 ⇒ 该形态下**所有**场景的 required
#         都不含多写者能力。
#
#   ⇒ 「多写者场景不得选单写者档位」这条硬边界不再只由 scenario_writers 一张
#   表撑着：改弱那张表（scenario_writers）或改弱存储的 max_writers，**各自都会
#   当场红**（两张表互相钉住）。
#
# 能力没主 = 没人推进。每条缺口都必须挂 issue（或已经落到 contract/gate 上）。
version: 1

capabilities:
  - id: idempotency-key-scope
    title: 幂等键作用域（租户 / 运行进键，Attempt 不进键）
    requires_multi_writer: false
    state: available
    evidence:
      - kind: contract
        ref: sideeffect/key_scope.go#ActionKeyBuilder
      - kind: contract
        ref: worker/managed.go#ManagedWork
    delivered_by: "#261"

  - id: context-cancellation
    title: Context 取消与在途收口
    requires_multi_writer: false
    state: available
    evidence:
      - kind: contract
        ref: contract/contract.go#RunContext
      - kind: contract
        ref: sideeffect/runner.go#Runner

  - id: taskboard-persistence
    title: 任务板持久化（单机文件 / PG）
    requires_multi_writer: false
    state: available
    evidence:
      - kind: contract
        ref: taskboard/taskboard.go#Board
      - kind: contract
        ref: examples/sqliteadapter/board.go#Store.Board
      - kind: contract
        ref: examples/pgstore/board.go#BoardStore

  - id: startup-recovery
    title: 启动恢复（重放 / 截断残尾 / 续读）
    requires_multi_writer: false
    state: available
    evidence:
      - kind: contract
        ref: examples/sqliteadapter/store.go#Open
      - kind: gate
        ref: test

  - id: single-store-full-state
    title: 单一存储覆盖全部状态（任务板之外还含副作用 / 事件 / 快照）
    requires_multi_writer: false
    state: available
    delivered_by: "#419"
    evidence:
      - kind: contract
        ref: examples/sqliteadapter/apply.go#Store.Apply
      - kind: contract
        ref: examples/sqliteadapter/effect.go#Store.Effects
      - kind: contract
        ref: examples/sqliteadapter/snapshot.go#Store.Snapshots
      - kind: contract
        ref: examples/sqliteadapter/event.go#Store.Events

  - id: progress-reconciliation
    title: 进度快照与副作用对账（单调序号 + 未知态裁决）
    requires_multi_writer: false
    state: available
    evidence:
      - kind: contract
        ref: checkpoint/cas.go#StoreCAS
      - kind: contract
        ref: sideeffect/store.go#Store

  - id: multi-process-claim
    title: 多进程竞争认领（原子读-判-写）
    requires_multi_writer: true
    state: available
    evidence:
      - kind: contract
        ref: taskboard/taskboard.go#Board
      - kind: contract
        ref: examples/pgstore/board.go#BoardStore

  - id: unified-lease
    title: 统一租约（令牌由存储铸造、代次单调）
    requires_multi_writer: true
    state: available
    evidence:
      - kind: contract
        ref: taskboard/renew.go#RenewingBoard
      - kind: contract
        ref: worker/managed_lease.go#LeaseSession
    delivered_by: "#265"

  - id: lease-renewal
    title: 长任务租约自动续期 + 资格确认
    requires_multi_writer: false
    state: available
    evidence:
      - kind: contract
        ref: worker/managed_lease.go#LeaseSession
      - kind: gate
        ref: test
    delivered_by: "#265"

  - id: database-clock
    title: 数据库时钟作为过期判定的唯一权威
    requires_multi_writer: false
    state: available
    evidence:
      - kind: contract
        ref: examples/pgstore/effect.go#EffectStore
      - kind: contract
        ref: examples/pgstore/board.go#BoardStore

  - id: cross-process-token
    title: 跨进程令牌（存储侧铸造、不靠进程内自增）
    requires_multi_writer: true
    state: available
    evidence:
      - kind: contract
        ref: examples/pgstore/board.go#BoardStore

  - id: tenant-scoped-storage
    title: 租户隔离落到持久化面（effect / 事件表租户维度 + 缺租户 fail-closed）
    requires_multi_writer: false
    state: available
    evidence:
      - kind: contract
        ref: examples/pgstore/effect.go#NewTenantEffectStore
      - kind: contract
        ref: examples/pgstore/event.go#NewTenantEventStore
      - kind: gate
        ref: integration
    delivered_by: "#275"

  - id: reliable-events
    title: 可靠事件面（Outbox / 已提交水位线，无空洞推进）
    requires_multi_writer: true
    state: available
    evidence:
      - kind: contract
        ref: eventbus/tailstore.go#TailStore
      - kind: contract
        ref: eventbus/tailstore.go#WatermarkTailStore
      - kind: contract
        ref: examples/pgstore/event.go#EventStore
    delivered_by: "#264"

  - id: quota-reclaim
    title: 配额预占的 TTL / 归属与安全回收
    requires_multi_writer: true
    state: available
    evidence:
      - kind: contract
        ref: scheduling/quota_store.go#QuotaStore
      - kind: contract
        ref: scheduling/quota_store.go#TaskLeaseOracle
    delivered_by: "#267"

  - id: job-idempotency
    title: 外部作业的稳定执行幂等标识
    requires_multi_writer: true
    state: available
    evidence:
      - kind: contract
        ref: examples/containerbackend/k8sjob.go#K8sJob
      - kind: gate
        ref: test
    delivered_by: "#263"

  - id: network-egress-enforcement
    title: K8s 出站禁网的实测校验（策略接受 ≠ 数据面生效）
    requires_multi_writer: false
    state: available
    evidence:
      - kind: contract
        ref: examples/containerbackend/k8sjobegress.go#K8sEgressProbe
      - kind: gate
        ref: k8s-e2e
      - kind: doc
        ref: docs/K8S-EGRESS-E2E-20261119.md
      - kind: issue
        ref: "#418"
    delivered_by: "#418"

  - id: authority-uniqueness
    title: 控制面与任务板共享同一份权威状态（不写第二份任务状态）
    requires_multi_writer: true
    state: available
    evidence:
      - kind: contract
        ref: controlplane/authority.go#NewAuthoritativeStorePlane
      - kind: contract
        ref: examples/pgstore/control.go#ControlStore
    delivered_by: "#268"

  - id: ownership-epoch
    title: 跨区域所有权代次（Ownership Epoch + 转移确认）
    requires_multi_writer: true
    state: available
    evidence:
      - kind: contract
        ref: ownership/ownership.go#Authority
      - kind: contract
        ref: ownership/ownership.go#Epoch
      - kind: contract
        ref: ownership/local.go#NewLocal
    delivered_by: "#273"

  - id: partition-write-fencing
    title: 分区期间旧区域写入被 fence 拒绝
    requires_multi_writer: true
    state: available
    evidence:
      - kind: contract
        ref: ownership/ownership.go#Fencer
      - kind: contract
        ref: ownership/judge.go#Judge
      - kind: contract
        ref: ownership/local.go#Local.Fence
    delivered_by: "#273"

  - id: reliable-handoff
    title: 可靠交接（回执 + 代次 + 台面状态）
    requires_multi_writer: true
    state: available
    evidence:
      - kind: contract
        ref: handoff/desk.go#Desk
      - kind: contract
        ref: handoff/ledger.go#Ledger

scenarios:
  - id: single-process-agent
    title: 单进程 Agent
    storage: memory
    worker: single-process
    required: [idempotency-key-scope, context-cancellation]
    readiness: available
    notes: 单进程不是「不用判据」：幂等键作用域与取消收口是后续扩容时不返工的前提。

  - id: single-host-persistent
    title: 单机持久化
    storage: examples/sqliteadapter
    worker: single-node
    required: [taskboard-persistence, startup-recovery, single-store-full-state, progress-reconciliation]
    readiness: available
    notes: sqliteadapter 是真 SQLite（WAL 单文件）：门面暴露 11 个面访问器（任务板 / 副作用 / 租户作用域副作用 / 进度快照 / 事件 / 租户作用域事件 / 下游栅栏 / 租户作用域栅栏 / 尾随游标 / 租户作用域尾随游标 / 控制面），共用一份事务域（同一个写句柄 + 同一个库文件，一次提交，#419 清偿 #188 的残留）。

  - id: multi-process-same-host
    title: 同机多进程
    storage: PostgreSQL
    worker: multi-process
    required: [multi-process-claim, unified-lease, database-clock, cross-process-token, tenant-scoped-storage]
    readiness: available
    notes: 多租户共享一个库时用 NewTenant* 装配；缺租户上下文写入 fail-closed。

  - id: k8s-single-cluster
    title: K8s 单集群多副本
    storage: PostgreSQL
    worker: deployment
    required: [unified-lease, lease-renewal, reliable-events, quota-reclaim, job-idempotency, network-egress-enforcement, tenant-scoped-storage]
    readiness: available
    notes: 出站禁网的真集群实测已落地（kind + Calico 真集群，#418，结论见 docs/K8S-EGRESS-E2E-20261119.md）；其余能力已落到契约 / 参考实现。

  - id: multi-cluster-single-region
    title: 多集群单区域
    storage: shared-authority-pg
    worker: local-workers
    required: [authority-uniqueness, reliable-events, tenant-scoped-storage, reliable-handoff]
    readiness: available
    notes: 共享权威 PostgreSQL；控制面强释经任务板同一份状态（#268）。

  - id: cross-region-multi-cluster
    title: 跨区域多集群
    storage: regional-authority
    worker: regional-workers
    required: [ownership-epoch, partition-write-fencing, reliable-handoff]
    readiness: available
    notes: 跨区域 Ownership Authority 与分区写入 fence 已由 ownership 包交付（#273）；多区域共享权威存储仍是部署侧的形态选择。