# 路线达成登记面（issue #279）
#
# 这张表回答一个问题：**总纲单声明的路线，是不是真的全部达成了**。
#
# # 为什么需要它
#
# 路线此前只以两种形态存在：总纲单 issue 的正文（散文表格）与台账 §4 的
# 「目标态定义」（散文）。两者都说「已全部达成」，但**没有任何机器判据**——
# 「已达成」这句话本身没人核。⇒ 路线达成与否只能靠人读两段散文得出结论，
# 而本仓的纪律恰恰是「事实要有主，判据不能靠人读」。
#
# 总纲单在台账 §9 的**判据形态**写的就是「台账与本文档一致」⇒ 本表是那句话的
# **可执行形态**：路线成员逐条在台账里必须已合入（带关闭 PR 号），否则即红。
#
# # 谁是唯一真相
#
# **阶段归属以本表为准**（它是路线成员关系的唯一声明面）。
# 台账 §9 的「阶段」列是历史登记，**不参与对账**：后续审计轮次的新单也复用
# L1/L2 标签（它们服务于同一目标域，但不是三阶段的原始成员）⇒ 拿它做反向对账
# 会把几十条无关单号拖进来。
#
# # 判据边界（如实登记）
#
# 机器判得了「**已登记的路线成员是否都达成**」，判不了「**什么算一个路线阶段**」
# —— 那是人的判断，不是语法能推出来的。故：
#
#   - 新增阶段 ⇒ 必须在本表登记（人维护，由 review 与台账纪律兜住）；
#   - 漏登记的后果是「新阶段的成员不被本门禁核」⇒ **这是本表的已知边界**，
#     登记面靠 review 守，不靠机器守；
#   - GitHub 侧的「已关闭」由 `ledgercheck` 判据 5 全量对账（它对台账里**所有**
#     登记单号对账）⇒ 本表**不重复**判 GitHub 状态，避免同一事实两处判定漂移。
updated: 2026-11-24

