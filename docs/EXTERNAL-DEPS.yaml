# 外部依赖清单（issue #482）——由 make external-deps -update 生成骨架。
#
# 人只维护**判断**字段：role（tool/stamp/decide）、seam（接缝符号）、
# exempt（显式豁免理由）、reason（判定理由）。刷新**不会**覆盖这些字段。
# 新出现的条目 role 留空 ⇒ 门禁判红，等人判定。
#
# 键 = 目录 + 函数名。deps 是实测值（刷新时按代码现状覆盖）。
updated: ""
deps:
    - package: archcheck
      function: FindRoot
      deps:
        - fs
      role: tool
      seam: ""
      exempt: ""
      reason: 执行外部动作本身就是目的：注入了就能绕过真实文件/真实命令（门禁纪律本身要求读真文件、跑真命令）
    - package: archcheck
      function: Load
      deps:
        - fs
      role: tool
      seam: ""
      exempt: ""
      reason: 执行外部动作本身就是目的：注入了就能绕过真实文件/真实命令（门禁纪律本身要求读真文件、跑真命令）
    - package: archcheck
      function: RunWithOptions
      deps:
        - clock
      role: decide
      seam: ""
      exempt: 例外到期判定本身已可注入（exceptionExpiry(ex, now)），门禁入口读的是**当下墙钟**——「现在」的正确答案就是本机时钟；给宿主注入时钟会让门禁对着假时钟判。
      reason: 例外到期判定本身已可注入（exceptionExpiry(ex, now)），门禁入口读的是**当下墙钟**——「现在」的正确答案就是本机时钟；给宿主注入时钟会让门禁对着假时钟判。
